<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Hellder Fit"/>
<meta name="theme-color" content="#17181b"/>
<title>Hellder Fit</title>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-180.png"/>
<link rel="icon" type="image/png" href="icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet"/>
<style>
/* ─────────────────────────────────────────────────────────────
   HELLDER FIT 3 — piso de academia, giz e anilhas
   ───────────────────────────────────────────────────────────── */
:root {
  --floor: #17181b;   /* piso emborrachado */
  --s1: #202228;      /* superfícies */
  --s2: #2a2d34;
  --line: #34373f;
  --chalk: #eeece7;   /* texto principal, cor de giz */
  --chalk2: #b0b3ba;
  --chalk3: #858993;
  --ok: #3dd68c;
  --err: #ff6b6b;
  --work: #ff7a5c;
  --water: #4fa8ff;
  --day: var(--chalk);
  --day-ink: var(--floor);
  --fd: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --fs: "Barlow", -apple-system, system-ui, "Segoe UI", sans-serif;
  --r-lg: 22px;
  --r-md: 14px;
  --r-sm: 10px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--floor); overscroll-behavior: none; }
body {
  color: var(--chalk); font-family: var(--fs); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; overflow: hidden;
}
#root { height: 100dvh; max-width: 520px; margin: 0 auto; position: relative; }
button, input, a { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button { background: none; border: 0; cursor: pointer; text-align: left; }
button:disabled { cursor: default; }
a { text-decoration: none; }
:focus-visible { outline: 2px solid var(--chalk); outline-offset: 2px; border-radius: 6px; }
input {
  background: var(--s2); border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 12px 12px; font-size: 16px; width: 100%; min-width: 0; color: var(--chalk);
}
input:focus { outline: none; border-color: var(--chalk2); }
input::placeholder { color: var(--chalk3); }
input[type="date"] { min-height: 46px; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--chalk2); }
.small { font-size: 13.5px; }
.center { text-align: center; }
[hidden] { display: none !important; }

/* ── estrutura ─────────────────────────────── */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--floor); }
.main, .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.main::-webkit-scrollbar, .scroll::-webkit-scrollbar { display: none; }
.page { padding: calc(var(--safe-t) + 18px) 18px 28px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 20px; }
.hello { font-family: var(--fd); font-weight: 700; font-size: 34px; line-height: 1.05; letter-spacing: .2px; }
.display { font-family: var(--fd); font-weight: 700; font-size: 32px; line-height: 1; letter-spacing: .2px; }
.display.xl { font-size: 52px; }
.h3 { font-family: var(--fd); font-weight: 600; font-size: 21px; letter-spacing: .2px; margin: 4px 0 10px; }
.block { margin-top: 30px; }
.block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.block-head .h3 { margin-bottom: 10px; }

/* ── navegação ─────────────────────────────── */
.nav {
  flex-shrink: 0; display: flex; background: rgba(23, 24, 27, .92);
  backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  border-top: 1px solid var(--line); padding: 6px 6px calc(6px + var(--safe-b));
}
.nav button {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0 5px;
  color: var(--chalk3); font-size: 12px; font-weight: 600; border-radius: 12px; transition: color .15s;
}
.nav button.on { color: var(--chalk); }
.nav button.on svg { stroke-width: 2.4; }

/* ── botões ────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px;
  padding: 12px 18px; border-radius: 14px; font-weight: 700; font-size: 16px; text-align: center;
  transition: transform .1s, opacity .15s; user-select: none;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--chalk); color: var(--floor); }
.btn.day { background: var(--day); color: var(--day-ink); }
.btn.ghost { background: var(--s2); color: var(--chalk); }
.btn.danger { background: var(--err); color: #1a0d0d; }
.btn.danger-text { color: var(--err); }
.btn.wide { width: 100%; margin-top: 10px; }
.btn.big { min-height: 56px; font-size: 17px; border-radius: 16px; }
.btn.small { min-height: 38px; padding: 8px 14px; font-size: 15px; border-radius: 11px; }
.icon-btn { width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; color: var(--chalk2); flex-shrink: 0; }
.icon-btn:active { background: var(--s2); }
.link { color: var(--chalk); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 4px; padding: 8px 0; text-decoration: underline; text-decoration-color: var(--chalk3); text-underline-offset: 3px; }
.chip { padding: 8px 14px; border-radius: 999px; background: var(--s2); font-weight: 600; font-size: 14px; flex-shrink: 0; }
.chip.on { background: var(--chalk); color: var(--floor); }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--s2); border: 1px solid var(--line); font-family: var(--fd); font-weight: 700; font-size: 21px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* ── listas ────────────────────────────────── */
.list { background: var(--s1); border-radius: var(--r-md); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; width: 100%; min-height: 56px; }
.list > * + *, .list > .row + .row { border-top: 1px solid var(--line); }
button.row:active { background: var(--s2); }
.row-main { flex: 1; min-width: 0; }
.row-main.as-btn { padding: 0; }
.row-title { font-weight: 600; font-size: 16px; line-height: 1.3; }
.row-sub { font-size: 14px; color: var(--chalk2); margin-top: 2px; line-height: 1.4; }
.row-idx { width: 24px; text-align: center; font-family: var(--fd); font-weight: 600; font-size: 19px; color: var(--chalk3); flex-shrink: 0; }
.row.done .row-title, .meal.done .row-title { color: var(--chalk2); }
.time { font-family: var(--fd); font-weight: 600; color: var(--chalk2); font-size: 16px; margin-right: 4px; }
.row > .time { width: 46px; flex-shrink: 0; }
.check { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; color: transparent; flex-shrink: 0; transition: all .15s; }
.check.on { background: var(--chalk); border-color: var(--chalk); color: var(--floor); }
.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.kv span { color: var(--chalk2); }
.kv.big strong { font-family: var(--fd); font-size: 30px; }
.empty { background: var(--s1); border-radius: var(--r-md); padding: 20px 16px; color: var(--chalk2); text-align: center; }
.empty.small { padding: 14px; font-size: 14.5px; }
.note { background: var(--s1); border-left: 3px solid var(--day); border-radius: 0 var(--r-md) var(--r-md) 0; padding: 13px 14px; font-size: 15px; color: var(--chalk2); margin: 12px 0; display: flex; gap: 8px; align-items: flex-start; }
.note strong { color: var(--chalk); }
.note.rehab { --day: #f5b800; margin-top: 20px; }
.note.rehab .icon-btn { margin: -8px -8px 0 0; }
.bar { height: 5px; background: var(--s2); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.bar > div { height: 100%; border-radius: 3px; transition: width .4s; }

/* ── HOJE ──────────────────────────────────── */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: center; padding: 6px 0 0; }
.hero-plate { grid-row: span 1; }
.hero-text p { margin-top: 4px; }
.hero-text .display.xl { color: var(--day); margin-top: 2px; }
.hero-actions { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 18px; }
.hero.rest { grid-template-columns: 1fr; background: var(--s1); border-radius: var(--r-lg); padding: 20px; }
.hero.rest .display.xl { color: var(--chalk); }
.next-up { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding: 10px 12px; background: var(--s2); border-radius: 14px; width: 100%; }
.next-up span { flex: 1; }
.resume { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; margin-bottom: 18px; background: var(--s1); border-radius: var(--r-md); border: 1px solid var(--day); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wday { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0 8px; border-radius: 14px; }
.wday.today { background: var(--s1); }
.wday-l { font-size: 12.5px; color: var(--chalk2); font-weight: 600; }
.wday-dot {
  width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  border: 3px solid var(--c, var(--line)); font-family: var(--fd); font-weight: 700; font-size: 16px; color: var(--chalk2);
}
.wday.did .wday-dot { background: var(--c, var(--chalk)); color: var(--floor); }
.wday-n { font-size: 11.5px; color: var(--chalk3); font-weight: 600; }
.wday.today .wday-n, .wday.today .wday-l { color: var(--chalk); }
.week + .muted { margin-top: 10px; }
.mini-stats { display: grid; gap: 8px; }
.mini-stats button { background: var(--s1); border-radius: var(--r-md); padding: 13px 14px; display: grid; grid-template-columns: 1fr auto; align-items: baseline; }
.mini-stats button span { color: var(--chalk2); font-size: 15px; }
.mini-stats button strong { font-family: var(--fd); font-size: 20px; font-weight: 600; }
.mini-stats .bar { grid-column: 1 / -1; }

/* ── FICHA ─────────────────────────────────── */
.days { display: grid; gap: 8px; }
.day-card { display: flex; align-items: center; gap: 14px; background: var(--s1); border-radius: var(--r-md); padding: 12px 14px; width: 100%; border: 1px solid transparent; }
.day-card.is-today { border-color: var(--day); }
.day-card:active { background: var(--s2); }
.day-when { font-size: 13.5px; color: var(--chalk2); font-weight: 600; }
.day-name { font-family: var(--fd); font-weight: 700; font-size: 25px; line-height: 1.05; }
.day-meta { font-family: var(--fd); font-size: 17px; color: var(--chalk2); font-weight: 600; }
.rest-card { background: transparent; border: 1px dashed var(--line); }
.rest-dot { width: 58px; height: 58px; border-radius: 50%; border: 3px dashed var(--line); flex-shrink: 0; }
.rules { display: grid; gap: 1px; background: var(--line); border-radius: var(--r-md); overflow: hidden; }
.rules > div { background: var(--s1); padding: 13px 14px; color: var(--chalk2); font-size: 15px; }
.rules strong { color: var(--chalk); display: block; margin-bottom: 2px; }
.preview-head { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; }
.preview-head .display { color: var(--day); }

/* ── TREINO ────────────────────────────────── */
.topbar { display: flex; align-items: center; gap: 8px; padding: calc(var(--safe-t) + 8px) 12px 8px; border-bottom: 1px solid var(--line); background: var(--floor); flex-shrink: 0; }
.topbar-mid { flex: 1; display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
.topbar-mid strong { font-family: var(--fd); font-size: 22px; font-weight: 600; }
.session .scroll { padding: 18px 16px 0; }
.session-hero { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; }
.session-hero .display { color: var(--day); }
.exb { background: var(--s1); border-radius: var(--r-lg); padding: 14px 12px 8px; margin-bottom: 12px; transition: opacity .2s; }
.exb.complete { opacity: .72; }
.exb-head { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.exb-num { width: 30px; height: 30px; border-radius: 50%; background: var(--s2); display: flex; align-items: center; justify-content: center; font-family: var(--fd); font-weight: 700; font-size: 17px; flex-shrink: 0; margin-top: 2px; }
.exb-title { flex: 1; min-width: 0; }
.exb-title h3 { font-size: 17.5px; font-weight: 700; line-height: 1.25; }
.exb-title p { font-size: 14px; color: var(--chalk2); margin-top: 2px; }
.exb-head .icon-btn { margin: -6px -4px 0 0; }
.tag { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: var(--s2); color: var(--chalk); font-size: 12.5px; font-weight: 600; }
.sug { margin: 10px 0 2px; padding: 9px 12px; background: var(--s2); border-radius: 12px; font-size: 14.5px; color: var(--chalk); }
.sets { margin-top: 10px; }
.sets-head, .set { display: grid; grid-template-columns: 34px 1fr 74px 64px 46px; gap: 8px; align-items: center; }
.sets-head { font-size: 12.5px; color: var(--chalk3); font-weight: 600; padding: 0 0 4px; }
.sets-head span:nth-child(1), .sets-head span:nth-child(3), .sets-head span:nth-child(4) { text-align: center; }
.set { padding: 4px 0; border-radius: 12px; transition: background .2s; }
.set.done { background: color-mix(in srgb, var(--day) 12%, transparent); }
.set-n { text-align: center; font-family: var(--fd); font-weight: 600; font-size: 18px; color: var(--chalk2); }
.set-prev { font-size: 14px; color: var(--chalk3); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.set input { text-align: center; padding: 10px 4px; font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; border-radius: 10px; }
.set.done input { background: transparent; border-color: transparent; }
.set-chk { width: 44px; height: 42px; border-radius: 12px; border: 2px solid var(--line); background: var(--s2); color: var(--chalk3); display: flex; align-items: center; justify-content: center; transition: all .15s; }
.set-chk.on { color: var(--day-ink); }
.set-tools { display: flex; gap: 18px; padding: 2px 4px; }
.set-tools .link { font-size: 14px; text-decoration: none; color: var(--chalk2); }
.ss-next { padding: 0 4px 6px; }
.restbar { position: absolute; left: 10px; right: 10px; bottom: calc(10px + var(--safe-b)); background: var(--s2); border-radius: 18px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.55); border: 1px solid var(--line); }
.restbar-fill { position: absolute; left: 0; top: 0; bottom: 0; opacity: .22; transition: width .25s linear; }
.restbar.over { border-color: var(--ok); }
.restbar.over .restbar-fill { background: var(--ok) !important; opacity: .25; }
.restbar-in { position: relative; display: flex; align-items: center; gap: 6px; padding: 10px 10px 10px 16px; }
.restbar-t { flex: 1; display: flex; flex-direction: column; line-height: 1.1; }
.restbar-t span { font-size: 13px; color: var(--chalk2); }
.restbar-t strong { font-family: var(--fd); font-weight: 700; font-size: 34px; font-variant-numeric: tabular-nums; }
.rb-btn { min-width: 52px; height: 46px; border-radius: 12px; background: var(--s1); font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; padding: 0 10px; }
.rb-btn.strong { background: var(--chalk); color: var(--floor); min-width: 70px; }
.float-resume { position: absolute; left: 12px; right: 12px; bottom: calc(76px + var(--safe-b)); display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--s2); border: 1px solid var(--day); border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.5); font-weight: 600; z-index: 5; }
.float-resume span { flex: 1; }
.main.has-float .page { padding-bottom: 96px; }
.float-resume strong { font-family: var(--fd); font-size: 19px; }

/* ── resumo e tabata ───────────────────────── */
.summary { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 8px 0; }
.summary .display { margin-top: 10px; }
.summary .prs { width: 100%; text-align: left; margin-top: 10px; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; margin: 16px 0 14px; }
.stats3 > div { background: var(--s1); border-radius: var(--r-md); padding: 12px 8px; text-align: center; display: flex; flex-direction: column; }
.stats3 strong { font-family: var(--fd); font-size: 27px; font-weight: 700; line-height: 1.1; }
.stats3 span { font-size: 13px; color: var(--chalk2); }
.sheet .stats3 > div { background: var(--s2); }
.tabata { display: flex; flex-direction: column; align-items: center; gap: 8px; padding-bottom: 30px; }
.tabata-phase { font-weight: 700; font-size: 17px; }
.tabata-ring { position: relative; width: 230px; height: 230px; margin: 4px 0 8px; }
.tabata-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--fd); font-weight: 700; font-size: 104px; }
.dots { display: flex; gap: 7px; margin: 10px 0 8px; }
.dots span { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.dots span.on { background: var(--chalk2); }
.dots span.cur { background: var(--chalk); transform: scale(1.3); }

/* ── DIETA ─────────────────────────────────── */
.kcal { display: flex; align-items: baseline; gap: 10px; }
.kcal strong { font-family: var(--fd); font-size: 54px; font-weight: 700; line-height: 1; }
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
.macros strong { display: block; font-family: var(--fd); font-size: 24px; font-weight: 600; }
.macros small { font-size: 14px; color: var(--chalk3); font-family: var(--fs); font-weight: 500; }
.marmita { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.marmita > div { background: var(--s1); border-radius: var(--r-md); padding: 13px 14px; display: flex; flex-direction: column; gap: 2px; }
.marmita strong { font-size: 16.5px; }
.foods { padding: 2px 14px 12px 14px; display: grid; gap: 10px; }
.food { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; font-size: 15px; }
.food .small { grid-column: 1 / -1; }
.cups { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 8px; }
.cup { aspect-ratio: 1; border-radius: 12px; background: var(--s1); color: var(--chalk3); display: flex; align-items: center; justify-content: center; }
.cup.on { background: color-mix(in srgb, var(--water) 22%, var(--s1)); color: var(--water); }
.cup.on svg { fill: currentColor; }

/* ── EVOLUÇÃO ──────────────────────────────── */
.heat { display: grid; grid-template-rows: repeat(7, 1fr); gap: 4px; }
.heat-l { font-size: 11px; color: var(--chalk3); display: flex; align-items: center; }
.heat-c { aspect-ratio: 1; border-radius: 4px; background: var(--s2); }
.heat-c.on { background: var(--chalk); }
.heat-c.today { box-shadow: 0 0 0 2px var(--floor), 0 0 0 3.5px var(--chalk2); }
.heat-c.future { background: transparent; border: 1px solid var(--s2); }
.heat-cap { font-size: 13.5px; color: var(--chalk2); margin-top: 10px; min-height: 20px; }
.chart { background: var(--s1); border-radius: var(--r-md); padding: 12px 12px 6px; margin-top: 10px; }
.chart-readout { display: flex; align-items: baseline; gap: 10px; }
.chart-readout strong { font-family: var(--fd); font-size: 24px; font-weight: 700; }
.chart-readout span { font-size: 13.5px; color: var(--chalk2); }
.chart svg { display: block; margin-top: 4px; font-family: var(--fs); font-variant-numeric: tabular-nums; }
.inline-form { display: flex; gap: 8px; }
.inline-form .btn { flex-shrink: 0; }
.measures { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.measures label { background: var(--s1); border-radius: var(--r-md); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.unit-input { display: flex; align-items: center; gap: 6px; }
.unit-input input { background: transparent; border: 0; padding: 2px 0; font-family: var(--fd); font-size: 26px; font-weight: 600; }
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.ph-add, .ph { aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; position: relative; }
.ph-add { border: 1.5px dashed var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--chalk2); font-size: 14px; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph span { position: absolute; left: 6px; bottom: 6px; background: rgba(0,0,0,.65); padding: 1px 7px; border-radius: 6px; font-size: 12px; }
.ph-big { width: 100%; border-radius: var(--r-md); display: block; }
.badges { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.badge { display: flex; gap: 10px; align-items: center; background: var(--s1); border-radius: var(--r-md); padding: 12px; opacity: .45; }
.badge div { display: flex; flex-direction: column; line-height: 1.25; }
.badge strong { font-size: 15px; }
.badge-ic { width: 38px; height: 38px; border-radius: 50%; background: var(--s2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--chalk3); }
.badge.on { opacity: 1; }
.badge.on .badge-ic { background: #f5b800; color: var(--floor); }

/* ── PERFIL ────────────────────────────────── */
.form { display: grid; gap: 12px; margin-bottom: 14px; }
.form label { display: flex; flex-direction: column; gap: 5px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--s2); padding: 4px; border-radius: 14px; gap: 4px; }
.seg button { text-align: center; padding: 10px 0; border-radius: 10px; font-family: var(--fd); font-weight: 700; font-size: 20px; color: var(--chalk2); }
.seg button.on { background: var(--chalk); color: var(--floor); }
.sheet .h3 { margin-top: 24px; }

/* ── folhas, diálogos e avisos ─────────────── */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease; }
.sheet-wrap.center { align-items: center; padding: 20px; }
.sheet { background: var(--s1); width: 100%; max-width: 520px; max-height: 88dvh; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; animation: up .26s cubic-bezier(.2,.8,.2,1); padding-bottom: var(--safe-b); }
.sheet.tall { height: 88dvh; }
.sheet .list, .sheet .chart, .sheet .empty { background: var(--s2); }
.sheet .list > * + * { border-color: #3c3f48; }
.sheet .kv { border-color: #3c3f48; }
.sheet .btn.ghost { background: var(--s2); }
.sheet input { background: var(--s2); }
.sheet-grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 2px; flex-shrink: 0; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px 4px 20px; }
.sheet-head h2 { font-family: var(--fd); font-weight: 700; font-size: 25px; line-height: 1.1; }
.sheet-body { overflow-y: auto; padding: 8px 20px 24px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.sheet .tip { margin: 14px 0 6px; font-size: 16px; line-height: 1.55; }
.sheet .note { background: var(--s2); }
.dialog { background: var(--s1); border-radius: 22px; padding: 22px 20px 18px; width: 100%; max-width: 380px; animation: pop .2s ease; }
.dialog h3 { font-family: var(--fd); font-size: 26px; font-weight: 700; line-height: 1.1; }
.dialog p { color: var(--chalk2); margin-top: 8px; }
.dialog-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; }
.toast { position: fixed; left: 50%; top: calc(var(--safe-t) + 12px); transform: translate(-50%, -140%); z-index: 99; background: var(--chalk); color: var(--floor); padding: 12px 18px; border-radius: 14px; font-weight: 700; font-size: 15px; max-width: 92vw; width: max-content; text-align: center; transition: transform .35s cubic-bezier(.2,.9,.3,1.2); box-shadow: 0 10px 30px rgba(0,0,0,.5); pointer-events: none; }
.toast.show { transform: translate(-50%, 0); }
.toast.err { background: var(--err); color: #1a0d0d; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 360px) {
  .display.xl { font-size: 42px; }
  .sets-head, .set { grid-template-columns: 26px 1fr 66px 56px 44px; gap: 6px; }
}

</style>
