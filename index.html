<!DOCTYPE html>

<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Hellder Fit"/>
  <title>Hellder Fit</title>

  <!-- Fontes -->

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>

  <!-- React + Babel (roda direto no navegador, sem instalação) -->

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080808; --surface: #111111; --surface2: #1a1a1a; --surface3: #222222;
      --border: #2a2a2a; --accent: #c8f135; --accent2: #ff4d4d; --accent3: #4dffa0;
      --text: #f0f0f0; --muted: #666666; --gold: #f5c518;
    }
    html, body { height: 100%; background: var(--bg); }
    body { color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; height: 100dvh; }
    .app { display: flex; flex-direction: column; height: 100dvh; max-width: 430px; margin: 0 auto; position: relative; overflow: hidden; background: var(--bg); }
    .scroll { overflow-y: auto; flex: 1; padding-bottom: 80px; }
    .scroll::-webkit-scrollbar { width: 0; }
    .nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; background: rgba(10,10,10,0.97); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
    .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 12px; font-size: 10px; font-family: 'DM Sans'; font-weight: 600; color: var(--muted); letter-spacing: 0.5px; cursor: pointer; transition: all 0.2s; border: none; background: none; text-transform: uppercase; }
    .nav-btn.active { color: var(--accent); }
    .nav-btn svg { width: 22px; height: 22px; }
    .hero { background: linear-gradient(180deg,#1a1a1a 0%,var(--bg) 100%); padding: 20px 20px 0; position: relative; overflow: hidden; }
    .hero::before { content:''; position:absolute; top:-50px; right:-50px; width:200px; height:200px; background:radial-gradient(circle,rgba(200,241,53,0.12) 0%,transparent 70%); pointer-events:none; }
    .hero-greeting { font-family:'Space Mono'; font-size:11px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; margin-bottom:4px; }
    .hero-name { font-family:'Bebas Neue'; font-size:42px; letter-spacing:2px; line-height:1; color:var(--text); }
    .hero-sub { font-size:13px; color:var(--muted); margin-top:4px; font-weight:300; }
    .stats-bar { display:flex; gap:12px; padding:16px 20px; }
    .stat-pill { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 12px; text-align:center; }
    .stat-val { font-family:'Bebas Neue'; font-size:22px; color:var(--accent); }
    .stat-lbl { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; font-weight:600; }
    .week-bar { padding:0 20px 16px; }
    .week-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1.5px; font-weight:600; margin-bottom:10px; font-family:'Space Mono'; }
    .week-days { display:flex; gap:6px; }
    .day-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 4px; border-radius:10px; cursor:pointer; border:1px solid transparent; background:var(--surface); transition:all 0.2s; }
    .day-btn .dn { font-size:9px; color:var(--muted); font-weight:700; text-transform:uppercase; }
    .day-btn .dd { font-family:'Bebas Neue'; font-size:18px; color:var(--text); line-height:1; }
    .day-btn .dot { width:4px; height:4px; border-radius:50%; background:transparent; }
    .day-btn.today { border-color:var(--accent); background:rgba(200,241,53,0.06); }
    .day-btn.today .dd { color:var(--accent); }
    .day-btn.has-w .dot { background:var(--accent); }
    .day-btn.rest .dot { background:var(--muted); }
    .day-btn.sel { border-color:var(--accent); background:rgba(200,241,53,0.1); }
    .section { padding:0 20px; margin-bottom:16px; }
    .section-title { font-family:'Space Mono'; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-bottom:10px; }
    .wcard { background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; cursor:pointer; transition:all 0.2s; margin-bottom:8px; }
    .wcard:active { transform:scale(0.98); }
    .wcard-hdr { padding:16px; display:flex; align-items:center; gap:12px; }
    .wicon { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
    .wicon.push { background:linear-gradient(135deg,rgba(255,77,77,0.3),rgba(255,77,77,0.1)); }
    .wicon.pull { background:linear-gradient(135deg,rgba(77,255,160,0.3),rgba(77,255,160,0.1)); }
    .wicon.legs { background:linear-gradient(135deg,rgba(200,241,53,0.3),rgba(200,241,53,0.1)); }
    .wicon.upper { background:linear-gradient(135deg,rgba(100,150,255,0.3),rgba(100,150,255,0.1)); }
    .wicon.lower { background:linear-gradient(135deg,rgba(255,165,0,0.3),rgba(255,165,0,0.1)); }
    .tbadge { display:inline-block; font-size:9px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; padding:3px 8px; border-radius:6px; margin-bottom:4px; }
    .tbadge.push{background:rgba(255,77,77,0.15);color:#ff4d4d;} .tbadge.pull{background:rgba(77,255,160,0.15);color:#4dffa0;}
    .tbadge.legs{background:rgba(200,241,53,0.15);color:var(--accent);} .tbadge.upper{background:rgba(100,150,255,0.15);color:#6496ff;}
    .tbadge.lower{background:rgba(255,165,0,0.15);color:orange;}
    .wcard-name { font-family:'Bebas Neue'; font-size:22px; color:var(--text); letter-spacing:1px; line-height:1; }
    .wcard-meta { font-size:12px; color:var(--muted); margin-top:2px; }
    .rest-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; text-align:center; }
    .today-wcard { background:linear-gradient(135deg,#1a1f0a,#111); border:1px solid rgba(200,241,53,0.3); border-radius:16px; padding:20px; margin:0 20px 16px; position:relative; overflow:hidden; cursor:pointer; }
    .today-wcard::before { content:''; position:absolute; top:-30px; right:-30px; width:120px; height:120px; background:radial-gradient(circle,rgba(200,241,53,0.15) 0%,transparent 70%); }
    .today-tag { font-family:'Space Mono'; font-size:9px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; margin-bottom:6px; }
    .today-wname { font-family:'Bebas Neue'; font-size:36px; letter-spacing:2px; line-height:1; }
    .today-wsub { font-size:13px; color:var(--muted); margin-top:4px; }
    .start-btn { display:flex; align-items:center; gap:8px; margin-top:16px; background:var(--accent); color:#000; font-weight:700; font-size:13px; letter-spacing:1px; text-transform:uppercase; padding:12px 20px; border-radius:12px; border:none; cursor:pointer; width:100%; justify-content:center; font-family:'DM Sans'; }
    /* WORKOUT VIEW */
    .wview { position:absolute; inset:0; background:var(--bg); z-index:40; overflow-y:auto; }
    .wview::-webkit-scrollbar{width:0;}
    .wview-hero { padding:20px; padding-top:54px; background:linear-gradient(135deg,#0f1a00,#080808); border-bottom:1px solid var(--border); position:relative; }
    .back-btn { position:absolute; top:16px; left:16px; z-index:10; width:36px; height:36px; border-radius:50%; background:rgba(0,0,0,0.6); backdrop-filter:blur(10px); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text); }
    .wview-type { font-family:'Space Mono'; font-size:10px; color:var(--accent); letter-spacing:2px; text-transform:uppercase; margin-bottom:4px; }
    .wview-name { font-family:'Bebas Neue'; font-size:40px; letter-spacing:2px; line-height:1; }
    .wview-meta { font-size:13px; color:var(--muted); margin-top:6px; }
    .prog-bar { height:3px; background:var(--border); margin-top:16px; border-radius:2px; }
    .prog-fill { height:100%; background:var(--accent); border-radius:2px; transition:width 0.4s; }
    .finish-btn { margin:16px 20px; color:#000; font-weight:700; font-size:14px; letter-spacing:1px; text-transform:uppercase; padding:16px; border-radius:14px; border:none; cursor:pointer; width:calc(100% - 40px); font-family:'DM Sans'; }
    /* EXERCISE ITEM */
    .ex-item { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:12px; cursor:pointer; transition:all 0.2s; margin-bottom:8px; }
    .ex-item:active { transform:scale(0.98); background:var(--surface2); }
    .ex-num { font-family:'Bebas Neue'; font-size:28px; color:var(--border); line-height:1; width:28px; flex-shrink:0; }
    .ex-info { flex:1; }
    .ex-name { font-size:14px; font-weight:600; color:var(--text); }
    .ex-meta { font-size:12px; color:var(--muted); margin-top:2px; }
    .ex-check { width:24px; height:24px; border-radius:8px; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.2s; }
    .ex-check.done { border-color:var(--accent); background:var(--accent); }
    /* EXERCISE DETAIL */
    .ex-detail { position:absolute; inset:0; background:var(--bg); z-index:50; overflow-y:auto; }
    .ex-detail::-webkit-scrollbar{width:0;}
    .ex-hero { height:200px; background:linear-gradient(135deg,#1a1a1a,#0d0d0d); display:flex; align-items:center; justify-content:center; font-size:80px; position:relative; overflow:hidden; }
    .ex-hero::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,transparent 50%,var(--bg) 100%); }
    .ex-body { padding:0 20px 100px; }
    .ex-title { font-family:'Bebas Neue'; font-size:32px; letter-spacing:2px; color:var(--text); margin-bottom:4px; }
    .badge-row { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
    .sbadge { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:4px 10px; font-size:12px; font-weight:600; color:var(--muted); }
    .sbadge.a { border-color:var(--accent); color:var(--accent); background:rgba(200,241,53,0.08); }
    .sbadge.g { border-color:#4dffa0; color:#4dffa0; background:rgba(77,255,160,0.06); }
    .tip-box { background:var(--surface); border-left:3px solid var(--accent); border-radius:0 12px 12px 0; padding:14px 16px; margin-bottom:16px; font-size:13px; color:var(--text); line-height:1.6; }
    .yt-btn { display:flex; align-items:center; gap:10px; background:linear-gradient(135deg,#ff0000,#cc0000); color:#fff; border:none; border-radius:14px; padding:14px 18px; width:100%; cursor:pointer; font-family:'DM Sans'; font-weight:700; font-size:14px; margin-bottom:16px; text-decoration:none; justify-content:center; }
    .yt-icon { width:28px; height:28px; background:#fff; border-radius:6px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .yt-icon svg { width:18px; height:18px; fill:#ff0000; }
    .action-row { display:flex; gap:8px; margin-bottom:24px; }
    .action-btn { flex:1; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 8px; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; transition:all 0.2s; font-size:11px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:0.5px; font-family:'DM Sans'; }
    .action-btn.active { border-color:var(--accent); color:var(--accent); background:rgba(200,241,53,0.06); }
    .log-section { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:16px; }
    .log-title { font-family:'Space Mono'; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-bottom:12px; }
    .set-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
    .set-label { font-size:12px; font-weight:700; color:var(--muted); width:40px; font-family:'Space Mono'; }
    .set-input { flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:8px 12px; color:var(--text); font-size:14px; font-family:'DM Sans'; text-align:center; width:0; }
    .set-input:focus { outline:none; border-color:var(--accent); }
    .set-unit { font-size:11px; color:var(--muted); width:24px; }
    .add-set-btn { width:100%; padding:10px; border-radius:10px; border:1px dashed var(--border); background:transparent; color:var(--muted); font-size:13px; cursor:pointer; font-family:'DM Sans'; margin-top:4px; }
    .save-btn { width:100%; padding:14px; border-radius:12px; border:none; background:var(--accent); color:#000; font-weight:700; font-size:14px; cursor:pointer; font-family:'DM Sans'; }
    .hist-item { background:var(--surface2); border-radius:10px; padding:12px 14px; margin-bottom:8px; }
    .hist-date { font-family:'Space Mono'; font-size:10px; color:var(--accent); margin-bottom:6px; }
    .sub-card { background:var(--surface2); border-radius:12px; padding:12px 14px; margin-bottom:8px; border:1px solid var(--border); }
    .sub-yt { display:flex; align-items:center; gap:8px; background:rgba(255,0,0,0.12); border:1px solid rgba(255,0,0,0.25); color:#ff4444; border-radius:8px; padding:8px 12px; font-size:12px; font-weight:700; text-decoration:none; margin-top:8px; }
    .sub-yt svg { width:16px; height:16px; fill:#ff4444; flex-shrink:0; }
    /* DIET */
    .macro-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
    .macro-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; }
    .macro-val { font-family:'Bebas Neue'; font-size:32px; color:var(--accent); line-height:1; }
    .macro-lbl { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; font-weight:600; margin-top:2px; }
    .macro-sub { font-size:11px; color:var(--muted); margin-top:2px; }
    .macro-bar { height:3px; background:var(--border); border-radius:2px; margin-top:8px; }
    .macro-fill { height:100%; border-radius:2px; }
    .meal-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; margin-bottom:10px; overflow:hidden; }
    .meal-hdr { padding:14px 16px; display:flex; align-items:center; gap:10px; cursor:pointer; }
    .meal-time { font-family:'Space Mono'; font-size:11px; color:var(--accent); }
    .meal-name { font-size:15px; font-weight:600; color:var(--text); }
    .meal-kcal { margin-left:auto; font-family:'Space Mono'; font-size:11px; color:var(--muted); }
    .meal-body { padding:0 16px 14px; border-top:1px solid var(--border); }
    .food-item { display:flex; justify-content:space-between; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--border); }
    .food-item:last-child { border-bottom:none; }
    .food-name { font-size:13px; color:var(--text); }
    .food-amt { font-size:12px; color:var(--muted); }
    .food-macros { display:flex; gap:8px; margin-top:2px; }
    .food-macro { font-size:10px; color:var(--muted); }
    .meal-check-btn { margin-top:10px; width:100%; padding:10px; border-radius:10px; border:1px solid var(--border); background:transparent; color:var(--muted); font-size:12px; font-weight:600; cursor:pointer; font-family:'DM Sans'; text-transform:uppercase; }
    .meal-check-btn.done { border-color:#4dffa0; color:#4dffa0; }
    .water-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:16px; }
    .water-cups { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
    .water-cup { width:36px; height:36px; border-radius:8px; border:2px solid var(--border); background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; }
    .water-cup.filled { border-color:#4daaff; background:rgba(77,170,255,0.15); }
    /* REWARDS */
    .xp-container { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:16px; }
    .xp-bar { height:8px; background:var(--border); border-radius:4px; overflow:hidden; margin:10px 0 6px; }
    .xp-fill { height:100%; background:linear-gradient(90deg,var(--accent),#a0c020); border-radius:4px; transition:width 0.8s; }
    .streak-card { background:linear-gradient(135deg,#1a1200,#110d00); border:1px solid rgba(245,197,24,0.3); border-radius:14px; padding:16px; margin-bottom:16px; display:flex; align-items:center; gap:16px; }
    .badges-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
    .badge-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; }
    .badge-card.locked { opacity:0.4; filter:grayscale(1); }
    .badge-card.unlocked { border-color:var(--gold); background:linear-gradient(135deg,#1a1500,#111); }
    .body-progress { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:16px; }
    .prog-item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); }
    .prog-item:last-child { border-bottom:none; }
    .prog-input { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:6px 10px; color:var(--text); font-size:14px; font-family:'DM Sans'; width:80px; text-align:center; }
    .prog-input:focus { outline:none; border-color:var(--accent); }
    /* TOAST */
    .toast { position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-80px); background:var(--accent); color:#000; padding:12px 20px; border-radius:12px; font-weight:700; font-size:14px; z-index:200; transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1); white-space:nowrap; max-width:90vw; text-align:center; }
    .toast.show { transform:translateX(-50%) translateY(0); }
    @keyframes slide-up { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
    .slide-up { animation:slide-up 0.3s ease forwards; }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(200,241,53,0.4)} 50%{box-shadow:0 0 0 12px rgba(200,241,53,0)} }
    .pulse { animation:pulse 2s infinite; }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; }
    input, button { -webkit-tap-highlight-color:transparent; }
    textarea { -webkit-appearance:none; }
    .profile-avatar { width:80px; height:80px; border-radius:50%; background:linear-gradient(135deg,var(--accent),#6a9000); display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue'; font-size:36px; color:#000; margin:0 auto 12px; border:3px solid var(--accent); }
  </style>

</head>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// ─── STORAGE ─────────────────────────────────────────────────────────────────
function useLS(key, init) {
  const [v, setV] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : init; } catch { return init; }
  });
  const set = (val) => {
    const next = typeof val === "function" ? val(v) : val;
    setV(next);
    try { localStorage.setItem(key, JSON.stringify(next)); } catch {}
  };
  return [v, set];
}

// ─── EXERCISE DETAIL ─────────────────────────────────────────────────────────
function ExerciseDetail({exercise, workoutId, onBack}) {
  const [tab, setTab] = useState("log");
  const key = `log_${workoutId}_${exercise.id}`;
  const [logs, setLogs] = useLS(key, []);
  const [sets, setSets] = useState([{reps:"",kg:""},{reps:"",kg:""},{reps:"",kg:""}]);
  const [note, setNote] = useState("");
  const [toast, setToast] = useState({show:false,msg:""});

  const toast2 = (msg) => { setToast({show:true,msg}); setTimeout(()=>setToast({show:false,msg:""}),2500); };
  const addSet = () => setSets(s=>[...s,{reps:"",kg:""}]);
  const rmSet = (i) => setSets(s=>s.filter((_,j)=>j!==i));
  const updSet = (i,f,v) => setSets(s=>s.map((x,j)=>j===i?{...x,[f]:v}:x));

  const save = () => {
    const valid = sets.filter(s=>s.reps||s.kg);
    if(!valid.length&&!note){toast2("⚠️ Preencha ao menos uma série");return;}
    setLogs(l=>[{date:new Date().toLocaleString("pt-BR"),sets:valid,note,ts:Date.now()},...l]);
    setSets([{reps:"",kg:""},{reps:"",kg:""},{reps:"",kg:""}]);
    setNote("");
    toast2("✅ Progressão salva!");
  };

  const lastLog = logs[0];
  const emoji = exercise.type==="legs"||exercise.type==="lower"?"🦵":exercise.type==="pull"?"💪":"🏋️";

  return (
    <div className="ex-detail slide-up">
      <Toast msg={toast.msg} show={toast.show}/>
      <button className="back-btn" onClick={onBack}><IcoBack/></button>
      <div className="ex-hero">
        <span style={{fontSize:80,position:"relative",zIndex:1}}>{emoji}</span>
      </div>
      <div className="ex-body">
        <div className="ex-title">{exercise.name}</div>
        <div className="badge-row">
          <span className="sbadge a">{exercise.sets} séries</span>
          <span className="sbadge">{exercise.reps} reps</span>
          {exercise.note&&<span className="sbadge">{exercise.note}</span>}
          {lastLog&&<span className="sbadge g">Último: {lastLog.sets[0]?.kg?lastLog.sets[0].kg+"kg":"—"}</span>}
        </div>

        <div className="tip-box">{exercise.tip}</div>

        {/* BOTÃO YOUTUBE - exercício principal */}
        {exercise.yt&&(
          <a className="yt-btn" href={exercise.yt} target="_blank" rel="noopener noreferrer">
            <div className="yt-icon"><IcoYT size={18} color="#ff0000"/></div>
            Ver execução no YouTube
          </a>
        )}

        <div className="action-row">
          <button className={`action-btn${tab==="log"?" active":""}`} onClick={()=>setTab("log")}>✏️<span>Registrar</span></button>
          <button className={`action-btn${tab==="subs"?" active":""}`} onClick={()=>setTab("subs")}>🔄<span>Substituir</span></button>
          <button className={`action-btn${tab==="hist"?" active":""}`} onClick={()=>setTab("hist")}>📊<span>Histórico</span></button>
        </div>

        {tab==="log"&&(
          <div className="log-section slide-up">
            <div className="log-title">Registrar séries</div>
            {sets.map((s,i)=>(
              <div className="set-row" key={i}>
                <span className="set-label">S{i+1}</span>
                <input className="set-input" type="number" placeholder="Reps" value={s.reps} onChange={e=>updSet(i,"reps",e.target.value)} inputMode="numeric"/>
                <span className="set-unit" style={{textAlign:"center"}}>×</span>
                <input className="set-input" type="number" placeholder="Kg" value={s.kg} onChange={e=>updSet(i,"kg",e.target.value)} inputMode="decimal"/>
                <span className="set-unit">kg</span>
                {sets.length>1&&<button onClick={()=>rmSet(i)} style={{background:"none",border:"none",color:"var(--muted)",cursor:"pointer",fontSize:18}}>×</button>}
              </div>
            ))}
            <button className="add-set-btn" onClick={addSet}>+ Adicionar série</button>
            <div style={{marginTop:12}}>
              <div className="log-title">Anotação livre</div>
              <textarea value={note} onChange={e=>setNote(e.target.value)} placeholder="Ex: boa execução, aumentar carga na próxima..." style={{width:"100%",background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:10,padding:"10px 12px",color:"var(--text)",fontSize:13,fontFamily:"DM Sans",resize:"none",height:80,marginBottom:12}}/>
            </div>
            <button className="save-btn" onClick={save}>💾 Salvar progressão</button>
          </div>
        )}

        {tab==="subs"&&(

// ─── WORKOUT VIEW ─────────────────────────────────────────────────────────────
function WorkoutView({workout, onBack, onFinish}) {
  const [done, setDone] = useLS(`done_${workout.id}`, []);
  const [selEx, setSelEx] = useState(null);
  const [toast, setToast] = useState({show:false,msg:""});

  const toast2 = (msg) => { setToast({show:true,msg}); setTimeout(()=>setToast({show:false,msg:""}),2500); };
  const toggle = (id,e) => { e.stopPropagation(); setDone(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]); };
  const progress = done.length/workout.exercises.length;

  const colors = {push:"#ff4d4d",pull:"#4dffa0",legs:"#c8f135",upper:"#6496ff",lower:"#ffaa00"};

  if(selEx) return (
    <div className="wview">
      <ExerciseDetail exercise={{...selEx,type:workout.type}} workoutId={workout.id} onBack={()=>setSelEx(null)}/>
    </div>
  );

  return (
    <div className="wview slide-up">
      <Toast msg={toast.msg} show={toast.show}/>
      <div className="wview-hero">
        <button className="back-btn" style={{position:"relative",top:"auto",left:"auto",marginBottom:16}} onClick={onBack}><IcoBack/></button>
        <div className="wview-type">{workout.label}</div>
        <div className="wview-name" style={{color:colors[workout.type]||"var(--accent)"}}>{workout.name}</div>
        <div className="wview-meta">{workout.exercises.length} exercícios • {done.length} concluídos</div>
        <div className="prog-bar"><div className="prog-fill" style={{width:`${progress*100}%`}}/></div>
      </div>

      <div style={{padding:"16px 20px 0"}}>
        {workout.exercises.map((ex,i)=>{
          let hasData=false;
          try{const d=localStorage.getItem(`log_${workout.id}_${ex.id}`);hasData=d&&JSON.parse(d).length>0;}catch{}
          const isDone=done.includes(ex.id);
          return (
            <div key={ex.id} className="ex-item" style={isDone?{opacity:0.6}:{}} onClick={()=>setSelEx(ex)}>
              <span className="ex-num">{String(i+1).padStart(2,"0")}</span>
              <div className="ex-info">
                <div className="ex-name" style={isDone?{textDecoration:"line-through"}:{}}>{ex.name}</div>
                <div className="ex-meta">{ex.sets} séries • {ex.reps} reps</div>
                <div style={{display:"flex",alignItems:"center",gap:4,marginTop:2}}>
                  <div style={{width:6,height:6,borderRadius:"50%",background:hasData?"var(--accent)":"var(--border)"}}/>
                  <span style={{fontSize:10,color:"var(--muted)"}}>{hasData?"Carga registrada":"Sem registro"}</span>
                </div>
              </div>
              <div className={`ex-check${isDone?" done":""}`} onClick={e=>toggle(ex.id,e)}>
                {isDone&&<IcoCheck/>}
              </div>
            </div>
          );
        })}
      </div>

      <button
        className={`finish-btn${progress>=0.99?" pulse":""}`}
        style={{background:progress>=0.99?"linear-gradient(135deg,var(--accent),#a0c020)":"var(--surface)",color:progress>=0.99?"#000":"var(--muted)",border:progress>=0.99?"none":"1px solid var(--border)"}}
        onClick={()=>onFinish(workout)}
      >
        {progress>=0.99?"🏆 Finalizar Treino":`Encerrar (${Math.round(progress*100)}% completo)`}
      </button>
    </div>
  );
}

// ─── APP PRINCIPAL ────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState("home");
  const [activeW, setActiveW] = useState(null);
  const [toast, setToast] = useState({show:false,msg:""});
  const [total, setTotal] = useLS("total_workouts",0);
  const [streak, setStreak] = useLS("streak",0);
  const [lastDate, setLastDate] = useLS("last_date",null);

  const toast2 = (msg) => { setToast({show:true,msg}); setTimeout(()=>setToast({show:false,msg:""}),3000); };

  const finish = (w) => {
    const today = new Date().toDateString();
    setTotal(n=>n+1);
    if(lastDate!==today){
      const yest=new Date(); yest.setDate(yest.getDate()-1);
      setStreak(s=>lastDate===yest.toDateString()?s+1:1);
      setLastDate(today);
    }
    setActiveW(null);
    toast2(`🏆 +100 XP — Treino ${w.name} concluído!`);
  };

  const tabs = [
    {id:"home",icon:<IcoHome/>,label:"Início"},
    {id:"diet",icon:<IcoDiet/>,label:"Dieta"},
    {id:"rewards",icon:<IcoTrophy/>,label:"Conquistas"},
    {id:"profile",icon:<IcoUser/>,label:"Perfil"},
  ];

  return (
    <div className="app">
      <Toast msg={toast.msg} show={toast.show}/>

      {activeW&&(
        <div className="wview">
          <WorkoutView workout={activeW} onBack={()=>setActiveW(null)} onFinish={finish}/>
        </div>
      )}

      <div className="scroll">
        {tab==="home"&&<HomeTab onStart={setActiveW}/>}
        {tab==="diet"&&<DietTab/>}
        {tab==="rewards"&&<RewardsTab/>}
        {tab==="profile"&&<ProfileTab/>}
      </div>

      <nav className="nav">
        {tabs.map(t=>(
          <button key={t.id} className={`nav-btn${tab===t.id?" active":""}`} onClick={()=>setTab(t.id)}>
            {t.icon}{t.label}
          </button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

</body>
</html>
