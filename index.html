*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0A0B;
  --s1:#131316;
  --s2:#1B1B21;
  --s3:#26262E;
  --br:#2A2A33;
  --br2:#3A3A46;
  --tx:#F5F5F7;
  --tx2:#9A9AA6;
  --tx3:#61616D;
  --acc:#D3FD50;
  --accS:rgba(211,253,80,.10);
  --red:#FF5B5B;
  --grn:#4DFFB0;
  --blu:#6B9BFF;
  --org:#FFA43D;
  --pur:#C77DFF;
  --gold:#F5C518;
  --fd:'Bebas Neue',sans-serif;
  --fs:'Inter',-apple-system,system-ui,sans-serif;
  --fm:'JetBrains Mono',monospace;
}
html,body{height:100%;background:#000;overscroll-behavior:none}
body{color:var(--tx);font-family:var(--fs);overflow:hidden;height:100dvh;-webkit-font-smoothing:antialiased}
#root{height:100dvh;position:relative;max-width:460px;margin:0 auto;overflow:hidden;background:var(--bg)}

.screen{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:1}
.screen.lv2{z-index:10}.screen.lv3{z-index:20}
.pg{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pg::-webkit-scrollbar{width:0;display:none}

/* ── NAV ─────────────────────────────────── */
.nav{flex-shrink:0;background:rgba(10,10,11,.88);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border-top:1px solid var(--br);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:2px}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0 8px;font-size:9.5px;font-weight:700;color:var(--tx3);letter-spacing:.4px;cursor:pointer;border:none;background:none;text-transform:uppercase;border-radius:14px;transition:color .2s,background .2s;font-family:var(--fs)}
.nb.on{color:var(--acc);background:var(--accS)}
.nb svg{width:21px;height:21px;stroke-width:2}
.nb.on svg{stroke-width:2.4}

/* ── HEADER ──────────────────────────────── */
.hd{padding:max(env(safe-area-inset-top),18px) 18px 0}
.h1{font-family:var(--fd);font-size:38px;letter-spacing:2.5px;line-height:1}
.eyebrow{font-family:var(--fm);font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--acc);margin-bottom:5px;font-weight:600}
.stl{font-family:var(--fm);font-size:9.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:1.8px;margin:20px 0 9px;font-weight:600}
.stl:first-child{margin-top:0}

/* ── CARDS ───────────────────────────────── */
.card{background:var(--s1);border:1px solid var(--br);border-radius:18px;padding:16px}
.card+.card{margin-top:10px}
.tile{background:var(--s1);border:1px solid var(--br);border-radius:15px;padding:12px 11px}
.tile-n{font-family:var(--fd);font-size:25px;line-height:1;letter-spacing:.5px}
.tile-l{font-size:8.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.9px;font-weight:700;margin-top:4px}

/* ── EXERCISE ROW ────────────────────────── */
.ex-row{display:flex;align-items:center;gap:13px;padding:14px 15px;background:var(--s1);border:1px solid var(--br);border-radius:16px;cursor:pointer;margin-bottom:8px;transition:transform .12s,background .15s}
.ex-row:active{transform:scale(.985);background:var(--s2)}
.ex-chk{width:28px;height:28px;border-radius:9px;border:2px solid var(--br2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;background:var(--s2)}
.ex-chk.on{border-color:var(--acc);background:var(--acc);color:#000}
.ex-chk svg{width:15px;height:15px}

/* ── INPUTS ──────────────────────────────── */
.si{flex:1;background:var(--s2);border:1px solid var(--br);border-radius:11px;padding:12px 8px;color:var(--tx);font-size:16px;font-family:var(--fs);text-align:center;width:0;font-weight:700}
.si:focus{outline:none;border-color:var(--acc);background:var(--s3)}
.si::placeholder{color:var(--tx3);font-weight:400}
.inp{background:var(--s2);border:1px solid var(--br);border-radius:11px;padding:12px 13px;color:var(--tx);font-size:16px;font-family:var(--fs);width:100%;font-weight:500}
.inp:focus{outline:none;border-color:var(--acc)}
.inp::placeholder{color:var(--tx3)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input,button,textarea,a{-webkit-tap-highlight-color:transparent}
textarea{background:var(--s2);border:1px solid var(--br);border-radius:12px;padding:12px 13px;color:var(--tx);font-size:14px;font-family:var(--fs);resize:none;width:100%;line-height:1.5}
textarea:focus{outline:none;border-color:var(--acc)}
textarea::placeholder{color:var(--tx3)}

/* ── BUTTONS ─────────────────────────────── */
.btn{border:none;border-radius:14px;padding:16px;font-weight:800;font-size:14.5px;cursor:pointer;font-family:var(--fs);width:100%;letter-spacing:.2px;transition:transform .12s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn-acc{background:var(--acc);color:#000}
.btn-ghost{background:var(--s2);color:var(--tx2);border:1px solid var(--br)}
.back-btn{width:40px;height:40px;border-radius:13px;background:var(--s2);border:1px solid var(--br);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx);flex-shrink:0;transition:transform .12s}
.back-btn:active{transform:scale(.92)}
.back-btn svg{width:19px;height:19px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:9px;font-size:11px;font-weight:700;font-family:var(--fs)}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px;border-radius:13px;cursor:pointer;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;font-family:var(--fs);border:1px solid var(--br);background:var(--s1);color:var(--tx3);transition:all .2s}
.tab-btn.on{border-color:var(--acc);background:var(--accS);color:var(--acc)}

/* ── MISC ────────────────────────────────── */
.timer-portal{position:fixed;inset:0;background:rgba(6,6,7,.97);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:24px}
.ring{position:relative;width:216px;height:216px;margin:0 auto 24px}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hm-c{aspect-ratio:1;border-radius:4px;background:var(--s2)}
.hm-c.tr{background:var(--acc)}
.hm-c.re{background:var(--s3)}
.hm-c.td{box-shadow:0 0 0 2px var(--acc)}
.tip{background:var(--s1);border-left:3px solid var(--acc);border-radius:0 14px 14px 0;padding:14px 16px;font-size:13.5px;line-height:1.65;color:var(--tx2)}
.sug{background:var(--accS);border:1px solid rgba(211,253,80,.22);border-radius:14px;padding:13px 15px;display:flex;align-items:flex-start;gap:11px}
.cup{width:36px;height:36px;border-radius:11px;border:1.5px solid var(--br);background:var(--s2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .15s}
.cup.on{border-color:#4DAAFF;background:rgba(77,170,255,.14)}
.badge-c{background:var(--s1);border:1px solid var(--br);border-radius:16px;padding:15px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.badge-c.lock{opacity:.28;filter:grayscale(1)}
.badge-c.unl{border-color:rgba(245,197,24,.4);background:linear-gradient(150deg,rgba(245,197,24,.07),var(--s1))}
.meal-c{background:var(--s1);border:1px solid var(--br);border-radius:16px;margin-bottom:9px;overflow:hidden}
.bar-chart{display:flex;align-items:flex-end;gap:5px;height:76px}
.ph-slot{aspect-ratio:1;border-radius:14px;cursor:pointer;border:1.5px dashed var(--br2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;color:var(--tx3);background:var(--s1)}
.divider{height:1px;background:var(--br)}

@keyframes su{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.su{animation:su .24s cubic-bezier(.22,1,.36,1) forwards}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(211,253,80,.35)}50%{box-shadow:0 0 0 16px rgba(211,253,80,0)}}
.pulse{animation:pulse 2s infinite}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.fade{animation:fadein .3s ease}
</style>
</head>

  try {

};
const lsSet = (k, v) => {

};

// limpa chaves diárias antigas (evita lixo acumulado no localStorage)
function pruneDaily() {
  try {
    const today = dayKey();
    const kill = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k) continue;
      if ((k.startsWith("meals_") || k.startsWith("water_") || k.startsWith("done_") || k.startsWith("sup_")) && !k.endsWith(today)) kill.push(k);
    }
    kill.forEach(k => localStorage.removeItem(k));
  } catch {}
}

function compressImg(file, cb) {
  const r = new FileReader();
  r.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const MAX = 620;
      let w = img.width,
        h = img.height;
      if (w > h && w > MAX) {
        h = Math.round(h * MAX / w);
        w = MAX;
      } else if (h > MAX) {
        w = Math.round(w * MAX / h);
        h = MAX;
      }
      const c = document.createElement("canvas");
      c.width = w;
      c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      cb(c.toDataURL("image/jpeg", .68));
    };
    img.onerror = () => cb(null);
    img.src = ev.target.result;
  };
  r.onerror = () => cb(null);
  r.readAsDataURL(file);
}
