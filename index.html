<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Hellder Fit"/>
<title>Hellder Fit</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080808;--s1:#111;--s2:#1a1a1a;--s3:#222;--br:#2a2a2a;--acc:#c8f135;--red:#ff4d4d;--grn:#4dffa0;--blu:#6496ff;--org:#ffaa00;--tx:#f0f0f0;--mu:#555;--gold:#f5c518}
html,body{height:100%;background:#000}
body{color:var(--tx);font-family:'DM Sans',sans-serif;overflow:hidden;height:100dvh}
#root{height:100dvh;position:relative;max-width:430px;margin:0 auto;overflow:hidden;background:var(--bg)}
/* SCREENS */
.screen{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:1}
.screen.wk{z-index:10}
.screen.ex{z-index:20}
/* SCROLL */
.pg{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.pg::-webkit-scrollbar{width:0}
/* NAV */
.nav{flex-shrink:0;background:rgba(6,6,6,.97);backdrop-filter:blur(24px);border-top:1px solid var(--br);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 11px;font-size:9px;font-family:'DM Sans';font-weight:700;color:var(--mu);letter-spacing:.5px;cursor:pointer;border:none;background:none;text-transform:uppercase;transition:color .2s}
.nb.on{color:var(--acc)}.nb svg{width:20px;height:20px}
/* CARDS */
.card{background:var(--s1);border:1px solid var(--br);border-radius:16px}
/* EXERCISE ROW */
.ex-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--s1);border:1px solid var(--br);border-radius:14px;cursor:pointer;margin-bottom:8px;transition:background .15s}
.ex-row:active{background:var(--s2)}
.ex-chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--br);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.ex-chk.on{border-color:var(--acc);background:var(--acc)}
/* INPUTS */
.si{flex:1;background:var(--s2);border:1px solid var(--br);border-radius:10px;padding:11px 8px;color:var(--tx);font-size:16px;font-family:'DM Sans';text-align:center;width:0;font-weight:600}
.si:focus{outline:none;border-color:var(--acc)}
/* TIMER — fixed to viewport always on top */
.timer-ov{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(16px)}
/* HEATMAP */
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.hm-c{aspect-ratio:1;border-radius:3px;background:var(--s2)}
.hm-c.tr{background:var(--acc)}.hm-c.re{background:var(--s3)}.hm-c.td{box-shadow:0 0 0 2px var(--acc)}
/* MISC */
.sec{padding:0 16px;margin-bottom:18px}
.stl{font-family:'Space Mono';font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px}
.btn-acc{background:var(--acc);color:#000;border:none;border-radius:13px;padding:15px;font-weight:800;font-size:14px;cursor:pointer;font-family:'DM Sans';width:100%;letter-spacing:.3px;transition:opacity .2s}
.btn-acc:active{opacity:.85}
.suggest{background:linear-gradient(135deg,rgba(200,241,53,.07),rgba(200,241,53,.02));border:1px solid rgba(200,241,53,.2);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:flex-start;gap:10px}
.tip-box{background:var(--s1);border-left:3px solid var(--acc);border-radius:0 12px 12px 0;padding:13px 15px;margin-bottom:14px;font-size:13px;line-height:1.65;color:var(--tx)}
.water-cup{width:34px;height:34px;border-radius:8px;border:2px solid var(--br);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .2s}
.water-cup.on{border-color:#4daaff;background:rgba(77,170,255,.15)}
.badge-c{background:var(--s1);border:1px solid var(--br);border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.badge-c.lock{opacity:.3;filter:grayscale(1)}.badge-c.unl{border-color:var(--gold);background:linear-gradient(135deg,#181200,#0e0e0e)}
.meal-c{background:var(--s1);border:1px solid var(--br);border-radius:14px;margin-bottom:10px;overflow:hidden}
.back-btn{width:38px;height:38px;border-radius:50%;background:var(--s2);border:1px solid var(--br);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx);flex-shrink:0}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;cursor:pointer;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;font-family:'DM Sans';border:1px solid var(--br);background:var(--s1);color:var(--mu);transition:all .2s}
.tab-btn.on{border-color:var(--acc);background:rgba(200,241,53,.07);color:var(--acc)}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:72px;padding:0 2px}
.b-bar{flex:1;border-radius:4px 4px 0 0;min-height:4px;transition:height .5s}
.ph-slot{aspect-ratio:1;border-radius:12px;overflow:hidden;cursor:pointer;border:2px dashed var(--br);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;color:var(--mu);background:var(--s2)}
@keyframes su{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.su{animation:su .22s ease forwards}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,241,53,.35)}50%{box-shadow:0 0 0 14px rgba(200,241,53,0)}}
.pulse{animation:pulse 2s infinite}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input,button,textarea{-webkit-tap-highlight-color:transparent}
textarea{background:var(--s2);border:1px solid var(--br);border-radius:10px;padding:10px 12px;color:var(--tx);font-size:13px;font-family:'DM Sans';resize:none;width:100%}
textarea:focus{outline:none;border-color:var(--acc)}
</style>
</head>

// ─── HELPERS ─────────────────────────────────────────────────────────────────
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
const rm1=(reps,kg)=>reps===1?kg:Math.round(kg*(1+reps/30));
const suggest=logs=>{
  if(!logs?.length)return null;
  const l=logs[0];if(!l.sets?.length)return null;
  const maxed=l.sets.every(s=>parseInt(s.r||0)>=12);
  if(maxed&&l.sets[0].kg)return`Bateu 12 reps! Tente ${(parseFloat(l.sets[0].kg)+2.5).toFixed(1)}kg hoje 💪`;
  return`Última: ${l.sets.map(s=>`${s.r||"?"}×${s.kg||"?"}kg`).join(" · ")}`;
};

// ─── TOAST ────────────────────────────────────────────────────────────────────
function Toast({msg,show,err}){
  return <div style={{position:"fixed",top:20,left:"50%",transform:`translateX(-50%) translateY(${show?0:-90}px)`,background:err?"var(--red)":"var(--acc)",color:err?"#fff":"#000",padding:"11px 20px",borderRadius:12,fontWeight:700,fontSize:14,zIndex:99999,transition:"transform .4s cubic-bezier(.34,1.56,.64,1)",whiteSpace:"nowrap",maxWidth:"88vw",textAlign:"center",pointerEvents:"none"}}>{msg}</div>;
}

// ─── REST TIMER — rendered in document body portal ────────────────────────────
// BUG FIX: timer now uses a module-level ref so it survives component re-renders
// and is attached directly to document body, avoiding z-index stacking issues.
function RestTimer({sec,onDone,onSkip}){
  const [left,setLeft]=useState(sec);
  const circ=2*Math.PI*54;
  useEffect(()=>{
    if(left<=0){onDone();return;}
    const t=setTimeout(()=>setLeft(l=>l-1),1000);
    return()=>clearTimeout(t);
  },[left]);
  const col=left<=10?"#ff4d4d":left<=30?"#ffaa00":"#c8f135";
  const dash=circ*(left/sec);
  return ReactDOM.createPortal(
    <div className="timer-ov" onClick={e=>e.stopPropagation()}>
      <div style={{fontFamily:"Space Mono",fontSize:10,color:"var(--mu)",letterSpacing:3,textTransform:"uppercase",marginBottom:28}}>⏱ Descanso entre séries</div>
      <div style={{position:"relative",width:180,height:180,marginBottom:28}}>
        <svg style={{position:"absolute",inset:0,transform:"rotate(-90deg)"}} viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="54" fill="none" stroke="#1a1a1a" strokeWidth="7"/>
          <circle cx="60" cy="60" r="54" fill="none" stroke={col} strokeWidth="7"
            strokeDasharray={`${dash} ${circ}`} strokeLinecap="round"
            style={{transition:"stroke-dasharray .95s linear,stroke .4s"}}/>
        </svg>
        <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
          <div style={{fontFamily:"Bebas Neue",fontSize:64,color:col,lineHeight:1,letterSpacing:2}}>{fmt(left)}</div>
          <div style={{fontSize:10,color:"var(--mu)",fontFamily:"Space Mono",letterSpacing:2}}>restantes</div>
        </div>
      </div>
      <div style={{display:"flex",gap:10,width:260}}>
        <button onClick={()=>setLeft(l=>Math.min(l+15,l+15))} style={{flex:1,padding:14,borderRadius:12,border:"1px solid var(--br)",background:"var(--s2)",color:"var(--tx)",fontWeight:700,fontSize:14,cursor:"pointer",fontFamily:"DM Sans"}}>+15s</button>
        <button onClick={onSkip} style={{flex:2,padding:14,borderRadius:12,border:"none",background:col,color:"#000",fontWeight:700,fontSize:14,cursor:"pointer",fontFamily:"DM Sans"}}>Pular ▶</button>
      </div>
    </div>,
    document.body
  );
}

// ─── MINI CHART ───────────────────────────────────────────────────────────────
function MiniChart({logs}){
  const pts=logs.slice(0,8).reverse().map(l=>({kg:parseFloat(l.sets?.[0]?.kg||0),d:l.date?.split(",")[0]||""})).filter(p=>p.kg>0);
  if(pts.length<2)return<div style={{textAlign:"center",color:"var(--mu)",padding:"18px 0",fontSize:13}}>Registre 2+ sessões para ver a evolução 📈</div>;
  const max=Math.max(...pts.map(p=>p.kg));
  return(
    <div style={{background:"var(--s2)",borderRadius:12,padding:"12px 12px 8px"}}>
      <div className="bar-chart">
        {pts.map((p,i)=>(
          <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
            <div style={{fontSize:8,color:"var(--acc)",fontFamily:"Space Mono",fontWeight:700,whiteSpace:"nowrap"}}>{p.kg}</div>
            <div style={{flex:1,width:"100%",display:"flex",alignItems:"flex-end"}}>
              <div className="b-bar" style={{width:"100%",height:`${Math.max((p.kg/max)*52,4)}px`,background:"linear-gradient(180deg,var(--acc),rgba(200,241,53,.25))"}}/>
            </div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:4}}>
        {pts.map((p,i)=><div key={i} style={{flex:1,textAlign:"center",fontSize:8,color:"var(--mu)",fontFamily:"Space Mono"}}>{p.d.slice(0,5)}</div>)}
      </div>
    </div>
  );
}

// ─── WORKOUT SCREEN ───────────────────────────────────────────────────────────
function WkScreen({wk,onBack,onFinish,goTab}){
  // BUG FIX: "done" uses a session key (date-based) so it resets each new day.
  // Additional manual reset happens when onFinish is called.
  const sessionKey=`done_${wk.id}_${new Date().toDateString()}`;
  const [done,setDone]=useState(()=>lsGet(sessionKey,[]));
  const [selEx,setSelEx]=useState(null);
  const [dark,setDark]=useLS("dark_wk",false);
  const [showConfirm,setShowConfirm]=useState(false);

  const saveDone=v=>{setDone(v);lsSet(sessionKey,v);};
  const pct=wk.ex.length>0?done.length/wk.ex.length:0;
  const col=TC[wk.type]||"var(--acc)";
  const bg=dark?"#000":"var(--bg)";
  const s1=dark?"#090909":"var(--s1)";

  // BUG FIX: finish clears done list AND removes the session key so next open is fresh
  const handleFinish=()=>{
    lsDel(sessionKey);
    setDone([]);
    onFinish(wk);
  };

  if(selEx)return<ExDetail ex={{...selEx,type:wk.type}} wid={wk.id} wrest={wk.rest} onBack={()=>setSelEx(null)} goTab={goTab} dark={dark}/>;

  return(
    <div className="screen wk" style={{background:bg}}>
      {/* CONFIRM FINISH MODAL */}
      {showConfirm&&ReactDOM.createPortal(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.88)",zIndex:9998,display:"flex",alignItems:"flex-end",justifyContent:"center",padding:"0 16px 32px"}} onClick={()=>setShowConfirm(false)}>
          <div style={{background:"var(--s1)",borderRadius:20,padding:24,width:"100%",maxWidth:398,border:"1px solid var(--br)"}} onClick={e=>e.stopPropagation()}>
            <div style={{fontFamily:"Bebas Neue",fontSize:26,letterSpacing:2,marginBottom:8}}>Finalizar treino?</div>
            <div style={{fontSize:14,color:"var(--mu)",marginBottom:20}}>
              {pct>=.99?"Treino 100% concluído! Incrível 🏆":`Você completou ${Math.round(pct*100)}% do treino. Tem certeza que quer encerrar?`}
            </div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setShowConfirm(false)} style={{flex:1,padding:14,borderRadius:12,border:"1px solid var(--br)",background:"var(--s2)",color:"var(--mu)",fontWeight:700,fontSize:14,cursor:"pointer",fontFamily:"DM Sans"}}>Continuar</button>
              <button onClick={handleFinish} style={{flex:2,padding:14,borderRadius:12,border:"none",background:`linear-gradient(135deg,${col},${col}aa)`,color:"#000",fontWeight:800,fontSize:14,cursor:"pointer",fontFamily:"DM Sans"}}>
                {pct>=.99?"🏆 Finalizar":"Encerrar mesmo assim"}
              </button>
            </div>
          </div>
        </div>,
        document.body
      )}

      {/* HEADER */}
      <div style={{flexShrink:0,background:`linear-gradient(160deg,${col}22,${col}08,${bg})`,borderBottom:"1px solid var(--br)",padding:"max(env(safe-area-inset-top),14px) 16px 16px"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
          <button className="back-btn" onClick={onBack}><I.back/></button>
          <div style={{flex:1}}>
            <div style={{fontFamily:"Space Mono",fontSize:10,color:col,letterSpacing:2,textTransform:"uppercase"}}>{wk.label}</div>
            <div style={{fontFamily:"Bebas Neue",fontSize:38,letterSpacing:3,lineHeight:1,color:col}}>{wk.name}</div>
          </div>
          <button onClick={()=>setDark(d=>!d)} style={{width:36,height:36,borderRadius:10,background:dark?"rgba(200,241,53,.1)":s1,border:`1px solid ${dark?"var(--acc)":"var(--br)"}`,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:dark?"var(--acc)":"var(--mu)"}}>
            {dark?<I.sun/>:<I.moon/>}
          </button>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
          <div style={{fontSize:13,color:"var(--mu)"}}>{wk.ex.length} exercícios</div>
          <div style={{width:3,height:3,borderRadius:"50%",background:"var(--br)"}}/>
          <div style={{fontSize:13,color:col,fontWeight:600}}>{done.length} concluídos</div>
          <div style={{width:3,height:3,borderRadius:"50%",background:"var(--br)"}}/>
          <div style={{fontSize:13,color:"var(--mu)"}}>descanso {wk.rest}s</div>
        </div>
        <div style={{height:4,background:"var(--br)",borderRadius:4,overflow:"hidden"}}>
          <div style={{height:"100%",background:`linear-gradient(90deg,${col},${col}99)`,borderRadius:4,width:`${pct*100}%`,transition:"width .4s"}}/>
        </div>
      </div>

      {/* LIST */}
      <div className="pg" style={{padding:"12px 16px 0"}}>
        {wk.ex.map((ex,i)=>{
          let has=false;try{const logs=lsGet(`lg_${wk.id}_${ex.id}`,[]);has=logs.length>0}catch{}
          const dn=done.includes(ex.id);
          return(
            <div key={ex.id} className="ex-row" style={{opacity:dn?.65:1,background:dn?s1:"var(--s1)"}} onClick={()=>setSelEx(ex)}>
              <div style={{fontFamily:"Bebas Neue",fontSize:22,color:"var(--br)",lineHeight:1,width:28,flexShrink:0,textAlign:"center"}}>{String(i+1).padStart(2,"0")}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:14,fontWeight:600,color:"var(--tx)",textDecoration:dn?"line-through":"none",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{ex.n}</div>
                <div style={{fontSize:12,color:"var(--mu)",marginTop:2}}>{ex.s} séries · {ex.r} reps</div>
                <div style={{display:"flex",alignItems:"center",gap:4,marginTop:3}}>
                  <div style={{width:5,height:5,borderRadius:"50%",background:has?"var(--acc)":"var(--br)"}}/>
                  <span style={{fontSize:10,color:"var(--mu)"}}>{has?"Carga registrada":"Sem registro"}</span>
                </div>
              </div>
              <div className={`ex-chk${dn?" on":""}`} onClick={e=>{e.stopPropagation();const next=dn?done.filter(x=>x!==ex.id):[...done,ex.id];saveDone(next);}}>
                {dn&&<I.chk/>}
              </div>
            </div>
          );
        })}
        {/* FINISH */}
        <button onClick={()=>setShowConfirm(true)} className={pct>=.99?"pulse":""}
          style={{width:"100%",padding:18,margin:"8px 0",borderRadius:14,border:pct>=.99?"none":"1px solid var(--br)",background:pct>=.99?`linear-gradient(135deg,${col},${col}aa)`:"var(--s2)",color:pct>=.99?"#000":"var(--mu)",fontWeight:800,fontSize:15,letterSpacing:.5,textTransform:"uppercase",cursor:"pointer",fontFamily:"DM Sans",boxShadow:pct>=.99?`0 0 28px ${col}55`:"none",transition:"all .3s"}}>
          {pct>=.99?"🏆 Finalizar Treino":`Encerrar · ${Math.round(pct*100)}% completo`}
        </button>
        <div style={{height:12}}/>
      </div>
      <div className="nav">
        {[["home","Início",<I.home/>],["diet","Dieta",<I.diet/>],["rewards","Conquistas",<I.trophy/>],["profile","Perfil",<I.user/>]].map(([id,lb,ic])=>(
          <button key={id} className="nb" onClick={()=>goTab(id)}>{ic}{lb}</button>
        ))}
      </div>
    </div>
  );
}

              <div key={w.id} style={{background:"var(--s1)",border:"1px solid var(--br)",borderRadius:14,cursor:"pointer",marginBottom:7}} onClick={()=>onStart(w)}>

// ─── DIET SCREEN ─────────────────────────────────────────────────────────────

        </div>

        {/* WATER */}
        <div style={{background:"var(--s1)",border:"1px solid var(--br)",borderRadius:14,padding:14,marginBottom:14}}>
          <div className="stl">Hidratação — {(water*.25).toFixed(2)}L / {DIET.water}L</div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:8}}>
            {Array.from({length:14},(_,i)=>(
              <button key={i} className={`water-cup${i<water?" on":""}`} onClick={()=>setWater(i<water?i:i+1)}>
                {i<water?"💧":"🫙"}
              </button>
            ))}
          </div>
          <div style={{fontSize:11,color:"var(--mu)"}}>{14-water} copos restantes para bater a meta</div>
        </div>

        {/* MEALS */}
        <div className="stl">Refeições do dia</div>
        {DIET.meals.map(meal=>{
          const dn=done.includes(meal.id);const op=open===meal.id;
          return(
            <div key={meal.id} className="meal-c" style={dn?{opacity:.7}:{}}>
              <div style={{padding:"13px 16px",display:"flex",alignItems:"center",gap:10,cursor:"pointer"}} onClick={()=>setOpen(op?null:meal.id)}>
                <div style={{flex:1}}>
                  <div style={{fontFamily:"Space Mono",fontSize:10,color:"var(--acc)"}}>{meal.time}</div>
                  <div style={{fontSize:15,fontWeight:600,textDecoration:dn?"line-through":"none"}}>{meal.name}</div>
                </div>
                <div style={{fontFamily:"Space Mono",fontSize:11,color:"var(--mu)"}}>{meal.kcal} kcal</div>
                <div style={{fontSize:18,marginLeft:4}}>{dn?"✅":"○"}</div>
              </div>
              {op&&(
                <div style={{padding:"0 16px 14px",borderTop:"1px solid var(--br)"}} className="su">
                  {meal.foods.map((f,i)=>(
                    <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",padding:"7px 0",borderBottom:i<meal.foods.length-1?"1px solid var(--br)":"none"}}>
                      <div>
                        <div style={{fontSize:13}}>{f.n}</div>
                        <div style={{display:"flex",gap:8,marginTop:2}}>
                          {[["P",f.p],["C",f.c],["G",f.f]].map(([l,v])=><span key={l} style={{fontSize:10,color:"var(--mu)"}}>{l}:<strong style={{color:"var(--tx)"}}>{v}g</strong></span>)}
                        </div>
                      </div>
                      <div style={{fontSize:12,color:"var(--mu)"}}>{f.a}</div>
                    </div>
                  ))}
                  <button onClick={()=>setDone(p=>p.includes(meal.id)?p.filter(x=>x!==meal.id):[...p,meal.id])}
                    style={{marginTop:10,width:"100%",padding:10,borderRadius:10,border:`1px solid ${dn?"var(--grn)":"var(--br)"}`,background:"transparent",color:dn?"var(--grn)":"var(--mu)",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"DM Sans",textTransform:"uppercase"}}>
                    {dn?"✅ Refeição concluída":"Marcar como concluída"}
                  </button>
                </div>
              )}
            </div>
          );
        })}
        <div style={{height:16}}/>
      </div>
    </div>
  );
}

// ─── REWARDS SCREEN ───────────────────────────────────────────────────────────
function RewardsScreen({total,streak}){
  const [stats,setStats]=useLS("bstats",{weight:"78",waist:"",chest:"",arm:""});
  const [photos,setPhotos]=useLS("photos",[]);
  const [saved,setSaved]=useState(false);
  const [rr,setRr]=useState("");const [rk,setRk]=useState("");
  const [trained]=useLS("trained_dates",[]);
  const fRef=useRef();
  const xp=total*100+streak*50;const lv=Math.floor(xp/500)+1;const lxp=xp%500;
  const oneRM=rr&&rk?rm1(parseInt(rr),parseFloat(rk)):null;
  const today=new Date();
  const cells=Array.from({length:35},(_,i)=>{const d=new Date(today);d.setDate(today.getDate()-34+i);return{tr:trained.includes(d.toDateString()),today:d.toDateString()===today.toDateString(),rest:SCHED[d.getDay()]==="rest"}});
  const addPh=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=ev=>setPhotos(p=>[{date:new Date().toLocaleDateString("pt-BR"),url:ev.target.result},...p].slice(0,12));r.readAsDataURL(f)};

  return(
    <div className="pg">
      <div style={{padding:"max(env(safe-area-inset-top),20px) 16px 0"}}>
        <div style={{fontFamily:"Bebas Neue",fontSize:34,letterSpacing:2,marginBottom:4}}>CONQUISTAS</div>
        <div style={{fontSize:13,color:"var(--mu)",marginBottom:14}}>Seu progresso rumo ao shape</div>
      </div>
      <div style={{padding:"0 16px"}}>
        {/* XP */}
        <div style={{background:"var(--s1)",border:"1px solid var(--br)",borderRadius:14,padding:14,marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
            <div>
              <div style={{fontSize:9,color:"var(--mu)",fontFamily:"Space Mono",textTransform:"uppercase",letterSpacing:1}}>Nível atual</div>
              <div style={{fontFamily:"Bebas Neue",fontSize:40,color:"var(--acc)",lineHeight:1}}>LVL {lv}</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:11,color:"var(--mu)",fontFamily:"Space Mono"}}>{xp} XP total</div>
              <div style={{fontSize:14,fontWeight:700,color:"var(--tx)",marginTop:2}}>{total} treinos</div>
            </div>
          </div>
          <div style={{height:8,background:"var(--br)",borderRadius:4,overflow:"hidden",marginBottom:5}}>
            <div style={{height:"100%",background:"linear-gradient(90deg,var(--acc),#a0c020)",borderRadius:4,width:`${(lxp/500)*100}%`,transition:"width .8s"}}/>
          </div>
          <div style={{fontSize:10,color:"var(--mu)",textAlign:"right",fontFamily:"Space Mono"}}>{500-lxp} XP para LVL {lv+1}</div>
        </div>

        {/* STREAK */}
        <div style={{background:"linear-gradient(135deg,#1a1200,#0e0e0e)",border:"1px solid rgba(245,197,24,.25)",borderRadius:14,padding:14,marginBottom:12,display:"flex",alignItems:"center",gap:14}}>
          <div style={{fontSize:38}}>🔥</div>
          <div>
            <div style={{fontFamily:"Bebas Neue",fontSize:48,color:"var(--gold)",lineHeight:1}}>{streak}</div>
            <div style={{fontSize:11,color:"#a08000",textTransform:"uppercase",letterSpacing:1,fontWeight:700}}>dias de streak</div>
          </div>
          <div style={{marginLeft:"auto",textAlign:"right"}}>
            <div style={{fontSize:9,color:"#a08000",fontFamily:"Space Mono",textTransform:"uppercase"}}>Total</div>
            <div style={{fontFamily:"Bebas Neue",fontSize:28,color:"var(--gold)"}}>{total}</div>
          </div>
        </div>

        {/* HEATMAP */}
        <div style={{background:"var(--s1)",border:"1px solid var(--br)",borderRadius:14,padding:14,marginBottom:12}}>
          <div className="stl">Calendário — últimos 35 dias</div>
          <div style={{display:"flex",marginBottom:6}}>
            {["D","S","T","Q","Q","S","S"].map((d,i)=><div key={i} style={{flex:1,textAlign:"center",fontSize:8,color:"var(--mu)",fontFamily:"Space Mono"}}>{d}</div>)}
          </div>
          <div className="hm">
            {cells.map((c,i)=><div key={i} className={`hm-c${c.tr?" tr":""}${c.rest&&!c.tr?" re":""}${c.today?" td":""}`}/>)}
          </div>
          <div style={{display:"flex",gap:10,marginTop:8,fontSize:10,color:"var(--mu)",alignItems:"center"}}>
            <div style={{display:"flex",alignItems:"center",gap:3}}><div style={{width:9,height:9,borderRadius:2,background:"var(--acc)"}}/> Treino</div>
            <div style={{display:"flex",alignItems:"center",gap:3}}><div style={{width:9,height:9,borderRadius:2,background:"var(--s3)"}}/> Descanso</div>
          </div>
        </div>

        {/* 1RM */}
        <div style={{background:"var(--s1)",border:"1px solid var(--br)",borderRadius:14,padding:14,marginBottom:12}}>
          <div className="stl">Calculadora de 1RM</div>
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            <input type="number" value={rr} onChange={e=>setRr(e.target.value)} placeholder="Reps" inputMode="numeric"
              style={{flex:1,background:"var(--s2)",border:"1px solid var(--br)",borderRadius:9,padding:"11px 10px",color:"var(--tx)",fontSize:15,fontFamily:"DM Sans",textAlign:"center",fontWeight:600}}/>
            <span style={{display:"flex",alignItems:"center",color:"var(--mu)",fontSize:14,fontWeight:700}}>×</span>
            <input type="number" value={rk} onChange={e=>setRk(e.target.value)} placeholder="Kg" inputMode="decimal"
              style={{flex:1,background:"var(--s2)",border:"1px solid var(--br)",borderRadius:9,padding:"11px 10px",color:"var(--tx)",fontSize:15,fontFamily:"DM Sans",textAlign:"center",fontWeight:600}}/>
          </div>
          {oneRM?<div style={{textAlign:"center",padding:"6px 0"}}>
            <div style={{fontSize:10,color:"var(--mu)",fontFamily:"Space Mono",textTransform:"uppercase",letterSpacing:1,marginBottom:4}}>Seu 1RM estimado</div>
            <div style={{fontFamily:"Bebas Neue",fontSize:56,color:"var(--acc)",lineHeight:1}}>{oneRM}<span style={{fontSize:22}}>kg</span></div>
            <div style={{fontSize:11,color:"var(--mu)",marginTop:3}}>Fórmula de Epley · valor teórico</div>
          </div>:<div style={{textAlign:"center",color:"var(--mu)",fontSize:13}}>Digite reps e kg para calcular</div>}
        </div>

        {/* BADGES */}
        <div className="stl">Conquistas</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
          {BADGES.map(b=>{const u=b.ok(total,streak);return(
            <div key={b.id} className={`badge-c${u?" unl":" lock"}`}>
              <div style={{fontSize:28}}>{b.ic}</div>
              <div style={{fontSize:11,fontWeight:700}}>{b.name}</div>
              <div style={{fontSize:10,color:"var(--mu)"}}>{b.desc}</div>
              {u&&<div style={{fontSize:9,color:"var(--gold)",fontWeight:700,letterSpacing:.5}}>✨ DESBLOQUEADO</div>}
            </div>
          )})}
        </div>

        {/* MEDIDAS */}
        <div className="stl">Medidas corporais</div>
        <div style={{background:"var(--s1)",border:"1px solid var(--br)",borderRadius:14,padding:14,marginBottom:12}}>
          {[["Peso","weight","kg"],["Cintura","waist","cm"],["Peito","chest","cm"],["Braço","arm","cm"]].map(([l,k,u])=>(
            <div key={k} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 0",borderBottom:"1px solid var(--br)"}}>
              <span style={{fontSize:13,color:"var(--mu)"}}>{l}</span>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <input type="number" value={stats[k]} onChange={e=>setStats(p=>({...p,[k]:e.target.value}))} inputMode="decimal" placeholder="—"
                  style={{background:"var(--s2)",border:"1px solid var(--br)",borderRadius:8,padding:"6px 9px",color:"var(--tx)",fontSize:14,fontFamily:"DM Sans",width:68,textAlign:"center"}}/>
                <span style={{fontSize:11,color:"var(--mu)",width:26}}>{u}</span>
              </div>
            </div>
          ))}
          <button onClick={()=>{setSaved(true);setTimeout(()=>setSaved(false),2e3)}} className="btn-acc" style={{marginTop:12}}>
            {saved?"✅ Salvo!":"Salvar medidas"}
          </button>
        </div>

        {/* PHOTOS */}
        <div className="stl">Fotos de progresso</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
          <div className="ph-slot" onClick={()=>fRef.current?.click()}><span style={{fontSize:22}}>📸</span><span>Adicionar</span></div>
          <input ref={fRef} type="file" accept="image/*" style={{display:"none"}} onChange={addPh}/>
          {photos.map((p,i)=>(
            <div key={i} style={{aspectRatio:"1",borderRadius:12,overflow:"hidden",position:"relative",border:"1px solid var(--br)"}}>
              <img src={p.url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
              <div style={{position:"absolute",bottom:0,left:0,right:0,background:"rgba(0,0,0,.7)",fontSize:7,color:"#fff",padding:"3px 5px",fontFamily:"Space Mono"}}>{p.date}</div>
            </div>
          ))}
        </div>

        <div style={{background:"linear-gradient(135deg,#0a1400,#080808)",border:"1px solid rgba(200,241,53,.15)",borderRadius:14,padding:16,marginBottom:20,textAlign:"center"}}>
          <div style={{fontSize:9,color:"var(--acc)",fontFamily:"Space Mono",letterSpacing:2,textTransform:"uppercase",marginBottom:6}}>Meta Principal</div>
          <div style={{fontFamily:"Bebas Neue",fontSize:28}}>🎯 SHAPE AGOSTO 2026</div>
          <div style={{fontSize:13,color:"var(--mu)",marginTop:4}}>Continue assim. Você vai chegar lá.</div>
        </div>
      </div>
    </div>
  );
}

// ─── APP ROOT ─────────────────────────────────────────────────────────────────
function App(){
  const [tab,setTab]=useState("home");
  const [activeWk,setActiveWk]=useState(null);
  const [toast,setToast]=useState({show:false,msg:""});
  const [total,setTotal]=useLS("total_wk",0);
  const [streak,setStreak]=useLS("streak",0);
  const [lastD,setLastD]=useLS("last_d",null);
  const [trained,setTrained]=useLS("trained_dates",[]);

  const t2=msg=>{setToast({show:true,msg});setTimeout(()=>setToast(v=>({...v,show:false})),3000)};
  const goTab=t=>{setActiveWk(null);setTab(t)};

  const finish=w=>{
    const td=new Date().toDateString();
    setTotal(n=>n+1);
    if(lastD!==td){const y=new Date();y.setDate(y.getDate()-1);setStreak(s=>lastD===y.toDateString()?s+1:1);setLastD(td);}
    if(!trained.includes(td))setTrained(d=>[...d,td]);
    setActiveWk(null);
    t2(`🏆 +100 XP — Treino ${w.name} concluído!`);
  };

  const tabs=[["home","Início",<I.home/>],["diet","Dieta",<I.diet/>],["rewards","Conquistas",<I.trophy/>],["profile","Perfil",<I.user/>]];

  return(
    <>
      <Toast msg={toast.msg} show={toast.show}/>
      {activeWk&&<WkScreen wk={activeWk} onBack={()=>setActiveWk(null)} onFinish={finish} goTab={goTab}/>}
      <div className="screen" style={{zIndex:activeWk?0:5}}>
        <div className="pg">
          {tab==="home"&&<HomeScreen onStart={setActiveWk} total={total} streak={streak}/>}
          {tab==="diet"&&<DietScreen/>}
          {tab==="rewards"&&<RewardsScreen total={total} streak={streak}/>}
          {tab==="profile"&&<ProfileScreen total={total}/>}
        </div>
        <nav className="nav">
          {tabs.map(([id,lb,ic])=>(
            <button key={id} className={`nb${tab===id?" on":""}`} onClick={()=>setTab(id)}>{ic}{lb}</button>
          ))}
        </nav>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
