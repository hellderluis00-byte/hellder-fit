<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Hellder Fit"/>
  <title>Hellder Fit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#080808;--surface:#111;--surface2:#1a1a1a;--surface3:#222;--border:#2a2a2a;--accent:#c8f135;--red:#ff4d4d;--green:#4dffa0;--blue:#6496ff;--orange:#ffaa00;--text:#f0f0f0;--muted:#666;--gold:#f5c518}
    html,body{height:100%;background:var(--bg)}
    body{color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden;height:100dvh}
    .app{display:flex;flex-direction:column;height:100dvh;max-width:430px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg)}
    .scroll{overflow-y:auto;flex:1;padding-bottom:80px}.scroll::-webkit-scrollbar{width:0}
    /* NAV */
    .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(8,8,8,0.97);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
    .nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;font-size:9px;font-family:'DM Sans';font-weight:700;color:var(--muted);letter-spacing:0.5px;cursor:pointer;border:none;background:none;text-transform:uppercase;transition:color 0.2s}
    .nb.active{color:var(--accent)}.nb svg{width:21px;height:21px}
    /* COMMON */
    .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
    .sec-title{font-family:'Space Mono';font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px}
    .page-title{font-family:'Bebas Neue';font-size:32px;letter-spacing:2px}
    .badge-pill{display:inline-block;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;border-radius:6px}
    .btn-accent{background:var(--accent);color:#000;border:none;border-radius:12px;padding:14px;font-weight:700;font-size:14px;cursor:pointer;font-family:'DM Sans';width:100%;letter-spacing:.5px}
    .btn-ghost{background:var(--surface);color:var(--muted);border:1px solid var(--border);border-radius:12px;padding:12px;font-weight:600;font-size:13px;cursor:pointer;font-family:'DM Sans';width:100%}
    /* HERO */
    .hero{background:linear-gradient(180deg,#1a1a1a 0%,var(--bg) 100%);padding:20px 20px 0;position:relative;overflow:hidden}
    .hero::before{content:'';position:absolute;top:-50px;right:-50px;width:200px;height:200px;background:radial-gradient(circle,rgba(200,241,53,0.12) 0%,transparent 70%);pointer-events:none}
    /* WEEK BAR */
    .week-days{display:flex;gap:6px}
    .day-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:10px;cursor:pointer;border:1px solid transparent;background:var(--surface);transition:all .2s}
    .day-btn.today{border-color:var(--accent);background:rgba(200,241,53,0.06)}
    .day-btn.today .dd{color:var(--accent)}
    .day-btn.sel{border-color:var(--accent);background:rgba(200,241,53,0.1)}
    .day-btn .dot{width:4px;height:4px;border-radius:50%;background:transparent}
    .day-btn.has-w .dot{background:var(--accent)}
    .day-btn.trained .dot{background:var(--green)}
    /* WORKOUT CARDS */
    .wcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;cursor:pointer;transition:all .2s;margin-bottom:8px}
    .wcard:active{transform:scale(0.98)}
    .wicon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
    .wicon.push{background:linear-gradient(135deg,rgba(255,77,77,.3),rgba(255,77,77,.1))}
    .wicon.pull{background:linear-gradient(135deg,rgba(77,255,160,.3),rgba(77,255,160,.1))}
    .wicon.legs{background:linear-gradient(135deg,rgba(200,241,53,.3),rgba(200,241,53,.1))}
    .wicon.upper{background:linear-gradient(135deg,rgba(100,150,255,.3),rgba(100,150,255,.1))}
    .wicon.lower{background:linear-gradient(135deg,rgba(255,165,0,.3),rgba(255,165,0,.1))}
    /* EXERCISE ITEMS */
    .ex-item{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .2s;margin-bottom:8px}
    .ex-item:active{transform:scale(0.98);background:var(--surface2)}
    .ex-check{width:26px;height:26px;border-radius:8px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
    .ex-check.done{border-color:var(--accent);background:var(--accent)}
    /* TIMER */
    .timer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
    .timer-ring{width:200px;height:200px;border-radius:50%;border:6px solid var(--border);display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:24px}
    .timer-svg{position:absolute;top:-6px;left:-6px;transform:rotate(-90deg)}
    .timer-num{font-family:'Bebas Neue';font-size:72px;color:var(--accent);line-height:1}
    .timer-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;font-family:'Space Mono'}
    /* CHARTS */
    .chart-container{background:var(--surface2);border-radius:12px;padding:12px;margin-top:12px;overflow:hidden}
    .chart-bar-row{display:flex;align-items:flex-end;gap:4px;height:80px;margin-bottom:6px}
    .chart-bar{flex:1;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--accent),rgba(200,241,53,.3));min-height:3px;transition:height .5s}
    .chart-label{font-size:9px;color:var(--muted);text-align:center;font-family:'Space Mono'}
    /* CALENDAR HEATMAP */
    .heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
    .hm-cell{aspect-ratio:1;border-radius:4px;background:var(--surface2)}
    .hm-cell.trained{background:var(--accent)}
    .hm-cell.rest{background:var(--surface3)}
    .hm-cell.today{box-shadow:0 0 0 2px var(--accent)}
    /* DARK MODE WORKOUT */
    .dark-mode{background:#000!important}
    .dark-mode *{--bg:#000;--surface:#080808;--surface2:#0d0d0d;--border:#1a1a1a}
    /* LOG */
    .log-section{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px}
    .log-title{font-family:'Space Mono';font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px}
    .set-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
    .set-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:15px;font-family:'DM Sans';text-align:center;width:0}
    .set-input:focus{outline:none;border-color:var(--accent)}
    /* SUGGESTION BOX */
    .suggest-box{background:linear-gradient(135deg,rgba(200,241,53,.08),rgba(200,241,53,.02));border:1px solid rgba(200,241,53,.25);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
    /* MEALS */
    .meal-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden}
    .meal-hdr{padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer}
    .meal-body{padding:0 16px 14px;border-top:1px solid var(--border)}
    .food-item{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border)}
    .food-item:last-child{border-bottom:none}
    .water-cup{width:36px;height:36px;border-radius:8px;border:2px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
    .water-cup.filled{border-color:#4daaff;background:rgba(77,170,255,.15)}
    /* BADGES */
    .badge-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
    .badge-card.locked{opacity:.35;filter:grayscale(1)}
    .badge-card.unlocked{border-color:var(--gold);background:linear-gradient(135deg,#1a1500,#111)}
    /* 1RM CALC */
    .rm-result{font-family:'Bebas Neue';font-size:48px;color:var(--accent);text-align:center;line-height:1}
    /* PHOTO PROGRESS */
    .photo-slot{aspect-ratio:1;background:var(--surface2);border:2px dashed var(--border);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:8px;font-size:12px;color:var(--muted)}
    .photo-slot.filled{border-style:solid;border-color:var(--border)}
    /* WEEKLY SUMMARY */
    .summary-card{background:linear-gradient(135deg,#0f1a00,#080808);border:1px solid rgba(200,241,53,.2);border-radius:16px;padding:18px;margin-bottom:16px}
    /* TOAST */
    .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--accent);color:#000;padding:12px 20px;border-radius:12px;font-weight:700;font-size:14px;z-index:999;transition:transform .4s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;max-width:90vw;text-align:center}
    .toast.show{transform:translateX(-50%) translateY(0)}
    .toast.red{background:var(--red);color:#fff}
    /* ANIMATIONS */
    @keyframes slide-up{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
    .su{animation:slide-up .25s ease forwards}
    @keyframes pulse-g{0%,100%{box-shadow:0 0 0 0 rgba(200,241,53,.4)}50%{box-shadow:0 0 0 14px rgba(200,241,53,0)}}
    .pulse{animation:pulse-g 2s infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
    input,button{-webkit-tap-highlight-color:transparent}
    textarea{-webkit-appearance:none;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-size:13px;font-family:'DM Sans';resize:none;width:100%}
    textarea:focus{outline:none;border-color:var(--accent)}
    /* BACK BTN */
    .back-btn{width:40px;height:40px;border-radius:50%;background:rgba(20,20,20,.95);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);flex-shrink:0}
    /* INLINE NAV (inside workout/exercise) */
    .inner-nav{background:rgba(8,8,8,.97);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback} = React;

};

// ─── LOCAL STORAGE ────────────────────────────────────────────────────────────
function useLS(key, init) {
  const [v, setV] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : init; } catch { return init; }
  });
  const set = val => {
    const next = typeof val === "function" ? val(v) : val;
    setV(next);
    try { localStorage.setItem(key, JSON.stringify(next)); } catch {}
  };
  return [v, set];
}

// ─── WORKOUT DATA ─────────────────────────────────────────────────────────────
const PROGRAM = {

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function fmt(s){const m=Math.floor(s/60),sec=s%60;return`${m}:${String(sec).padStart(2,"0")}`}
function compute1RM(reps,kg){return reps===1?kg:Math.round(kg*(1+reps/30))}
function getSuggestion(logs){
  if(!logs||logs.length===0)return null;
  const last=logs[0];
  if(!last.sets||last.sets.length===0)return null;
  const allMaxReps=last.sets.every(s=>parseInt(s.reps||0)>=12);
  if(allMaxReps&&last.sets[0].kg){
    const nextKg=parseFloat(last.sets[0].kg)+2.5;
    return`Você bateu 12 reps na última sessão. Tente ${nextKg}kg hoje! 💪`;
  }
  return`Última sessão: ${last.sets.map(s=>`${s.reps||"?"}x${s.kg||"?"}kg`).join(", ")}`;
}

// ─── REST TIMER ───────────────────────────────────────────────────────────────
function RestTimer({seconds,onDone,onSkip}){
  const [left,setLeft]=useState(seconds);
  const circ=283; // 2*PI*45
  useEffect(()=>{
    if(left<=0){onDone();return;}
    const t=setTimeout(()=>setLeft(l=>l-1),1000);
    return()=>clearTimeout(t);
  },[left]);
  const pct=left/seconds;
  const dash=circ*pct;
  const color=left<=10?"#ff4d4d":left<=30?"#ffaa00":"#c8f135";
  return(
    <div className="timer-overlay" onClick={e=>e.stopPropagation()}>
      <div style={{fontFamily:"Space Mono",fontSize:11,color:"var(--muted)",letterSpacing:3,textTransform:"uppercase",marginBottom:24}}>Descanso entre séries</div>
      <div className="timer-ring">
        <svg className="timer-svg" width="212" height="212">
          <circle cx="106" cy="106" r="45" fill="none" stroke="var(--border)" strokeWidth="6"/>
          <circle cx="106" cy="106" r="45" fill="none" stroke={color} strokeWidth="6"
            strokeDasharray={`${dash} ${circ}`} strokeLinecap="round" style={{transition:"stroke-dasharray .9s linear,stroke .5s"}}/>
        </svg>
        <div>
          <div className="timer-num" style={{color}}>{fmt(left)}</div>
          <div className="timer-label">restantes</div>
        </div>
      </div>
      <div style={{display:"flex",gap:12,width:260}}>
        <button onClick={()=>{setLeft(l=>Math.min(l+15,seconds));}} style={{flex:1,padding:14,borderRadius:12,border:"1px solid var(--border)",background:"var(--surface)",color:"var(--text)",fontWeight:700,fontSize:14,cursor:"pointer",fontFamily:"DM Sans"}}>+15s</button>
        <button onClick={onSkip} style={{flex:2,padding:14,borderRadius:12,border:"none",background:"var(--accent)",color:"#000",fontWeight:700,fontSize:14,cursor:"pointer",fontFamily:"DM Sans"}}>Pular ▶</button>
      </div>
    </div>
  );
}

// ─── EVOLUTION CHART ──────────────────────────────────────────────────────────
function EvoChart({logs}){
  if(!logs||logs.length<2)return(
    <div style={{textAlign:"center",color:"var(--muted)",padding:"20px 0",fontSize:13}}>Registre pelo menos 2 sessões para ver o gráfico 📈</div>
  );
  const pts=logs.slice(0,8).reverse().map(l=>({
    kg:parseFloat(l.sets?.[0]?.kg||0),
    date:l.date?.split(",")[0]||"—"
  })).filter(p=>p.kg>0);
  if(pts.length<2)return null;
  const max=Math.max(...pts.map(p=>p.kg));
  return(
    <div className="chart-container">
      <div className="chart-bar-row">
        {pts.map((p,i)=>(
          <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
            <div style={{fontSize:9,color:"var(--accent)",fontFamily:"Space Mono",fontWeight:700}}>{p.kg}kg</div>
            <div className="chart-bar" style={{height:`${Math.max((p.kg/max)*60,4)}px`}}/>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:4}}>
        {pts.map((p,i)=><div key={i} className="chart-label" style={{flex:1}}>{p.date.split("/").slice(0,2).join("/")}</div>)}
      </div>
    </div>
  );
}

              <button onClick={save} style={{width:"100%",padding:16,borderRadius:12,border:"none",background:"var(--accent)",color:"#000",fontWeight:700,fontSize:14,cursor:"pointer",fontFamily:"DM Sans"}}>💾 Salvar + Iniciar descanso</button>
              <div style={{marginTop:10,textAlign:"center",fontSize:11,color:"var(--muted)"}}>Timer de {restSec}s ativa automaticamente ao salvar • Toque em ⏱{restSec}s para alterar</div>
            </div>
          )}

          {/* EVOLUÇÃO */}
          {tab==="chart"&&(
            <div className="su">
              <div style={{fontSize:13,color:"var(--muted)",marginBottom:8}}>Carga da série 1 ao longo do tempo</div>
              <EvoChart logs={logs}/>
              {oneRM&&(
                <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:14,padding:16,marginTop:12,textAlign:"center"}}>
                  <div style={{fontFamily:"Space Mono",fontSize:10,color:"var(--muted)",letterSpacing:2,textTransform:"uppercase",marginBottom:6}}>1RM estimado</div>
                  <div style={{fontFamily:"Bebas Neue",fontSize:48,color:"var(--accent)",lineHeight:1}}>{oneRM}<span style={{fontSize:20}}>kg</span></div>
                  <div style={{fontSize:11,color:"var(--muted)",marginTop:4}}>Baseado na última sessão • Fórmula Epley</div>
                </div>
              )}
            </div>
          )}

          {/* SUBSTITUTOS */}
          {tab==="subs"&&(
            <div className="su">
              <div className="log-title" style={{marginBottom:12}}>Exercícios substitutos</div>
              {(exercise.subs||[]).map((sub,i)=>(
                <div key={i} style={{background:"var(--surface2)",borderRadius:12,padding:"12px 14px",marginBottom:8,border:"1px solid var(--border)"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                    <span style={{fontSize:18}}>🔄</span>
                    <span style={{fontSize:14,fontWeight:600,color:"var(--text)"}}>{sub}</span>
                  </div>
                  <a href={`https://www.youtube.com/results?search_query=${encodeURIComponent(sub+" execução musculação")}`} target="_blank" rel="noopener noreferrer"
                    style={{display:"flex",alignItems:"center",gap:8,background:"rgba(255,0,0,.1)",border:"1px solid rgba(255,0,0,.2)",color:"#ff4444",borderRadius:8,padding:"7px 12px",fontSize:12,fontWeight:700,textDecoration:"none"}}>
                    {Ico.yt(14,"#ff4444")} Ver execução no YouTube
                  </a>
                </div>
              ))}
            </div>
          )}

          {/* HISTÓRICO */}
          {tab==="hist"&&(
            <div className="su">
              <div className="log-title" style={{marginBottom:12}}>Histórico de cargas</div>
              {logs.length===0
                ?<div style={{textAlign:"center",color:"var(--muted)",padding:"30px 0",fontSize:13}}>Nenhum registro ainda.<br/>Comece a registrar suas séries! 💪</div>
                :logs.map((log,i)=>(
                  <div key={i} style={{background:"var(--surface2)",borderRadius:10,padding:"12px 14px",marginBottom:8}}>
                    <div style={{fontFamily:"Space Mono",fontSize:10,color:"var(--accent)",marginBottom:6}}>{log.date}</div>
                    {log.sets?.map((s,j)=>(
                      <div key={j} style={{fontSize:13,color:"var(--text)"}}>Série {j+1}: <strong style={{color:"var(--accent)"}}>{s.reps||"?"}x {s.kg||"?"}kg</strong></div>
                    ))}
                    {log.note&&<div style={{color:"var(--muted)",fontSize:12,marginTop:4,fontStyle:"italic"}}>📝 {log.note}</div>}
                  </div>
                ))
              }
            </div>
          )}
        </div>
      </div>
      <InnerNav onTabChange={onTabChange}/>
    </div>
  );
}

// ─── WORKOUT VIEW ─────────────────────────────────────────────────────────────
function WorkoutView({workout,onBack,onFinish,onTabChange}){
  const [done,setDone]=useLS(`done_${workout.id}`,[]);
  const [selEx,setSelEx]=useState(null);
  const [toast,setToast]=useState({show:false,msg:""});
  const [darkMode,setDarkMode]=useLS("dark_workout",false);
  const progress=done.length/workout.exercises.length;
  const toggle=(id,e)=>{e.stopPropagation();setDone(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id])};
  const bg=darkMode?"#000":"var(--bg)";
  const surf=darkMode?"#080808":"var(--surface)";

  if(selEx)return(
    <ExerciseDetail exercise={{...selEx,type:workout.type}} workoutId={workout.id} workoutRestSec={workout.restSec||90} onBack={()=>setSelEx(null)} onTabChange={onTabChange} darkMode={darkMode}/>
  );

  return(
    <div style={{position:"fixed",inset:0,background:bg,zIndex:40,display:"flex",flexDirection:"column",maxWidth:430,left:"50%",transform:"translateX(-50%)"}}>
      <Toast msg={toast.msg} show={toast.show}/>

      {/* HEADER */}
      <div style={{flexShrink:0,padding:"52px 20px 18px",background:darkMode?"#000":`linear-gradient(135deg,#0f1a00,${bg})`,borderBottom:"1px solid var(--border)",position:"relative"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
          <button onClick={onBack} className="back-btn"><Ico.back/></button>
          <div style={{flex:1}}>
            <div style={{fontFamily:"Space Mono",fontSize:10,color:"var(--accent)",letterSpacing:2,textTransform:"uppercase"}}>{workout.label}</div>
            <div style={{fontFamily:"Bebas Neue",fontSize:36,letterSpacing:2,lineHeight:1,color:TC[workout.type]}}>{workout.name}</div>
            <div style={{fontSize:12,color:"var(--muted)",marginTop:2}}>{workout.exercises.length} exercícios • {done.length} concluídos</div>
          </div>
          {/* Dark mode toggle */}
          <button onClick={()=>setDarkMode(d=>!d)} style={{width:38,height:38,borderRadius:10,background:darkMode?"rgba(200,241,53,.1)":"var(--surface2)",border:`1px solid ${darkMode?"var(--accent)":"var(--border)"}`,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:darkMode?"var(--accent)":"var(--muted)"}}>
            {darkMode?<Ico.sun/>:<Ico.moon/>}
          </button>
        </div>
        <div style={{height:3,background:"var(--border)",borderRadius:2}}>
          <div style={{height:"100%",background:TC[workout.type]||"var(--accent)",borderRadius:2,transition:"width .4s",width:`${progress*100}%`}}/>
        </div>
      </div>

      {/* LIST */}
      <div style={{flex:1,overflowY:"auto",WebkitOverflowScrolling:"touch",padding:"14px 20px 0"}}>
        {workout.exercises.map((ex,i)=>{
          let hasData=false;
          try{const d=localStorage.getItem(`log_${workout.id}_${ex.id}`);hasData=d&&JSON.parse(d).length>0}catch{}
          const isDone=done.includes(ex.id);
          return(
            <div key={ex.id} className="ex-item" style={{background:isDone?surf:"var(--surface)",opacity:isDone?.7:1}} onClick={()=>setSelEx(ex)}>
              <span style={{fontFamily:"Bebas Neue",fontSize:24,color:"var(--border)",lineHeight:1,width:28,flexShrink:0}}>{String(i+1).padStart(2,"0")}</span>
              <div style={{flex:1}}>
                <div style={{fontSize:14,fontWeight:600,color:"var(--text)",textDecoration:isDone?"line-through":"none"}}>{ex.name}</div>
                <div style={{fontSize:12,color:"var(--muted)",marginTop:2}}>{ex.sets} séries • {ex.reps} reps</div>
                <div style={{display:"flex",alignItems:"center",gap:4,marginTop:3}}>
                  <div style={{width:6,height:6,borderRadius:"50%",background:hasData?"var(--accent)":"var(--border)"}}/>
                  <span style={{fontSize:10,color:"var(--muted)"}}>{hasData?"Carga registrada":"Sem registro"}</span>
                </div>
              </div>
              <div className={`ex-check${isDone?" done":""}`} onClick={e=>toggle(ex.id,e)}>
                {isDone&&<Ico.check/>}
              </div>
            </div>
          );
        })}

        {/* FINISH BTN */}
        <button onClick={()=>onFinish(workout)} className={progress>=.99?"pulse":""}
          style={{margin:"14px 0 8px",width:"100%",padding:18,borderRadius:14,border:progress>=.99?"none":"1px solid var(--border)",background:progress>=.99?"linear-gradient(135deg,var(--accent),#a0c020)":"var(--surface2)",color:progress>=.99?"#000":"var(--muted)",fontWeight:700,fontSize:14,letterSpacing:1,textTransform:"uppercase",cursor:"pointer",fontFamily:"DM Sans",boxShadow:progress>=.99?"0 0 24px rgba(200,241,53,.3)":"none"}}>
          {progress>=.99?"🏆 Finalizar Treino":`Encerrar (${Math.round(progress*100)}% completo)`}
        </button>
        <div style={{height:8}}/>
      </div>
      <InnerNav onTabChange={onTabChange}/>
    </div>
  );
}

// ─── HOME TAB ─────────────────────────────────────────────────────────────────
function HomeTab({onStart,totalWorkouts,streak}){
  const today=new Date();
  const todayIdx=today.getDay();
  const [selDay,setSelDay]=useState(todayIdx);
  const [trainedDays]=useLS("trained_dates",[]);
  const [weekWeights]=useLS("weight_log",[]);

  const weekDates=Array.from({length:7},(_,i)=>{
    const d=new Date(today);d.setDate(today.getDate()-todayIdx+i);return d.getDate();
  });
  const sched=PROGRAM.schedule;
  const selWId=sched[selDay];
  const selW=selWId!=="rest"?PROGRAM.workouts[selWId]:null;
  const todayW=sched[todayIdx]!=="rest"?PROGRAM.workouts[sched[todayIdx]]:null;
  const aug=new Date(2026,7,1);
  const daysLeft=Math.ceil((aug-today)/86400000);
  const lastWeight=weekWeights.length>0?weekWeights[weekWeights.length-1].kg:"78";

  // WEEKLY SUMMARY (show on monday)
  const isMonday=todayIdx===1;
  const lastWeekTrainings=trainedDays.filter(d=>{
    const dd=new Date(d);
    const diff=(today-dd)/86400000;
    return diff<=7;
  }).length;

  return(
    <>
      <div className="hero">
        <div style={{fontFamily:"Space Mono",fontSize:11,color:"var(--accent)",letterSpacing:2,textTransform:"uppercase",marginBottom:4}}>// BOA NOITE</div>
        <div style={{fontFamily:"Bebas Neue",fontSize:42,letterSpacing:2,lineHeight:1}}>HELLDER</div>
        <div style={{fontSize:13,color:"var(--muted)",marginTop:4,fontWeight:300}}>A cada dia mais perto do shape de agosto 💪</div>
      </div>

      {/* STATS */}
      <div style={{display:"flex",gap:10,padding:"16px 20px"}}>
        {[
          {v:daysLeft,l:"Dias p/ agosto",c:"var(--accent)"},
          {v:lastWeight+"kg",l:"Peso atual",c:"#ff6464"},
          {v:`🔥${streak}`,l:"Streak dias",c:"var(--gold)"},
          {v:totalWorkouts,l:"Treinos",c:"var(--green)"},
        ].map((s,i)=>(
          <div key={i} style={{flex:1,background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"10px 8px",textAlign:"center"}}>
            <div style={{fontFamily:"Bebas Neue",fontSize:20,color:s.c,lineHeight:1}}>{s.v}</div>
            <div style={{fontSize:8,color:"var(--muted)",textTransform:"uppercase",letterSpacing:.5,fontWeight:600,marginTop:2}}>{s.l}</div>
          </div>
        ))}
      </div>

      {/* WEEKLY SUMMARY */}
      {isMonday&&lastWeekTrainings>0&&(
        <div className="summary-card" style={{margin:"0 20px 16px"}}>
          <div style={{fontFamily:"Space Mono",fontSize:10,color:"var(--accent)",letterSpacing:2,textTransform:"uppercase",marginBottom:8}}>📊 Resumo da semana passada</div>
          <div style={{fontFamily:"Bebas Neue",fontSize:28,color:"var(--text)"}}>Você treinou {lastWeekTrainings}x essa semana</div>
          <div style={{fontSize:13,color:"var(--muted)",marginTop:4}}>{lastWeekTrainings>=4?"Semana excelente! Continue assim 🔥":lastWeekTrainings>=2?"Boa semana. Tente adicionar mais um treino 💪":"Semana leve. Vamos aumentar a frequência! 🎯"}</div>
        </div>
      )}

      {/* WEEK BAR */}
      <div style={{padding:"0 20px 16px"}}>
        <div style={{fontFamily:"Space Mono",fontSize:11,color:"var(--muted)",textTransform:"uppercase",letterSpacing:1.5,fontWeight:600,marginBottom:10}}>Semana — Maio 2026</div>
        <div className="week-days">
          {WEEK_NAMES.map((d,i)=>{
            const wid=sched[i];
            const dateStr=new Date(today.getFullYear(),today.getMonth(),weekDates[i]).toDateString();
            const wasTrained=trainedDays.includes(dateStr);
            return(
              <button key={i} className={`day-btn${i===todayIdx?" today":""}${selDay===i?" sel":""}${wid!=="rest"?" has-w":" "}${wasTrained?" trained":""}`} onClick={()=>setSelDay(i)}>
                <span style={{fontSize:9,color:"var(--muted)",fontWeight:700,textTransform:"uppercase"}}>{d.slice(0,1)}</span>
                <span style={{fontFamily:"Bebas Neue",fontSize:18,color:i===todayIdx?"var(--accent)":"var(--text)",lineHeight:1}}>{weekDates[i]}</span>
                <span className="dot"/>
              </button>
            );
          })}
        </div>
      </div>

      {/* TODAY HIGHLIGHT */}
      {selDay===todayIdx&&todayW&&(
        <div onClick={()=>onStart(todayW)} style={{background:"linear-gradient(135deg,#1a1f0a,#111)",border:"1px solid rgba(200,241,53,.3)",borderRadius:16,padding:20,margin:"0 20px 16px",position:"relative",overflow:"hidden",cursor:"pointer"}}>
          <div style={{position:"absolute",top:-30,right:-30,width:120,height:120,background:"radial-gradient(circle,rgba(200,241,53,.15) 0%,transparent 70%)"}}/>
          <div style={{fontFamily:"Space Mono",fontSize:9,color:"var(--accent)",letterSpacing:2,textTransform:"uppercase",marginBottom:6}}>▶ TREINO DE HOJE</div>
          <div style={{fontFamily:"Bebas Neue",fontSize:36,letterSpacing:2,lineHeight:1,color:TC[todayW.type]}}>{todayW.name}</div>
          <div style={{fontSize:13,color:"var(--muted)",marginTop:4}}>{todayW.label} • {todayW.exercises.length} exercícios</div>
          <button style={{display:"flex",alignItems:"center",gap:8,marginTop:14,background:"var(--accent)",color:"#000",fontWeight:700,fontSize:13,letterSpacing:1,textTransform:"uppercase",padding:"12px 20px",borderRadius:12,border:"none",cursor:"pointer",width:"100%",justifyContent:"center",fontFamily:"DM Sans"}}>
            ▶ INICIAR TREINO
          </button>
        </div>
      )}

      {/* ALL WORKOUTS */}
      <div style={{padding:"0 20px"}}>
        <div className="sec-title">{selDay===todayIdx?"Todos os treinos":"Treino de "+WEEK_NAMES[selDay]}</div>
        {selW?(
          <div className="wcard" onClick={()=>onStart(selW)}>
            <div style={{padding:16,display:"flex",alignItems:"center",gap:12}}>
              <div className={`wicon ${selW.type}`}>{TI[selW.type]}</div>
              <div>
                <span className="badge-pill" style={{background:`${TC[selW.type]}22`,color:TC[selW.type],marginBottom:4,display:"block"}}>{selW.label}</span>
                <div style={{fontFamily:"Bebas Neue",fontSize:22,letterSpacing:1,lineHeight:1}}>{selW.name}</div>
                <div style={{fontSize:12,color:"var(--muted)",marginTop:2}}>{selW.exercises.length} exercícios • descanso {selW.restSec}s</div>
              </div>
              <div style={{marginLeft:"auto",color:"var(--muted)"}}><Ico.arrow/></div>
            </div>
          </div>
        ):(
          <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:16,padding:20,textAlign:"center"}}>
            <div style={{fontSize:32,marginBottom:8}}>😴</div>
            <div style={{fontFamily:"Bebas Neue",fontSize:22,color:"var(--muted)",letterSpacing:1}}>DIA DE DESCANSO</div>
            <div style={{fontSize:13,color:"var(--muted)",marginTop:4}}>Recuperação é parte do treino. Aproveite para caminhar ou alongar.</div>
          </div>
        )}

        {selDay===todayIdx&&(
          <>
            <div className="sec-title" style={{marginTop:20}}>Todos os treinos</div>
            {Object.values(PROGRAM.workouts).map(w=>(
              <div key={w.id} className="wcard" onClick={()=>onStart(w)}>
                <div style={{padding:14,display:"flex",alignItems:"center",gap:12}}>
                  <div className={`wicon ${w.type}`}>{TI[w.type]}</div>
                  <div>
                    <span className="badge-pill" style={{background:`${TC[w.type]}22`,color:TC[w.type],marginBottom:3,display:"block"}}>{w.label}</span>
                    <div style={{fontFamily:"Bebas Neue",fontSize:20,letterSpacing:1,lineHeight:1}}>{w.name}</div>
                    <div style={{fontSize:12,color:"var(--muted)",marginTop:2}}>{w.exercises.length} exercícios</div>
                  </div>
                  <div style={{marginLeft:"auto",color:"var(--muted)"}}><Ico.arrow/></div>
                </div>
              </div>
            ))}
          </>
        )}
        <div style={{height:16}}/>
      </div>
    </>
  );
}

// ─── DIET TAB ─────────────────────────────────────────────────────────────────
function DietTab(){
  const [done,setDone]=useLS("meals_done",[]);
  const [water,setWater]=useLS("water_cups",0);
  const [open,setOpen]=useState(null);
  const [weightLog,setWeightLog]=useLS("weight_log",[]);
  const [todayW,setTodayW]=useState("");
  const total14=14;
  const doneKcal=DIET.meals.filter(m=>done.includes(m.id)).reduce((a,m)=>a+m.kcal,0);
  const pct=Math.round((doneKcal/DIET.kcal)*100);
  const saveWeight=()=>{
    if(!todayW)return;
    const today=new Date().toLocaleDateString("pt-BR");
    setWeightLog(l=>[...l.filter(x=>x.date!==today),{date:today,kg:parseFloat(todayW)}].sort((a,b)=>new Date(a.date)-new Date(b.date)));
    setTodayW("");
  };

  return(
    <>
      <div style={{padding:"20px 20px 0"}}>
        <div className="page-title">DIETA</div>
        <div style={{fontSize:13,color:"var(--muted)",marginBottom:16}}>Protocolo de ganho de massa + definição</div>
      </div>
      <div style={{padding:"0 20px"}}>
        {/* MACROS */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
          {[
            {v:DIET.kcal,l:"Kcal/dia",s:`${doneKcal} consumidas (${pct}%)`,c:"var(--accent)",w:Math.min(pct,100)},
            {v:`${DIET.protein}g`,l:"Proteína",s:`${(DIET.protein/78).toFixed(1)}g/kg`,c:"#ff6464",w:75},
            {v:`${DIET.carbs}g`,l:"Carboidratos",s:"Energia para treinar",c:"#4daaff",w:70},
            {v:`${DIET.fat}g`,l:"Gordura",s:"Gorduras boas",c:"var(--orange)",w:40},
          ].map((m,i)=>(
            <div key={i} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:14,padding:14}}>
              <div style={{fontFamily:"Bebas Neue",fontSize:28,color:m.c,lineHeight:1}}>{m.v}</div>
              <div style={{fontSize:11,color:"var(--muted)",textTransform:"uppercase",letterSpacing:1,fontWeight:600,marginTop:2}}>{m.l}</div>
              <div style={{fontSize:11,color:"var(--muted)",marginTop:2}}>{m.s}</div>
              <div style={{height:3,background:"var(--border)",borderRadius:2,marginTop:8}}>
                <div style={{height:"100%",borderRadius:2,background:m.c,width:`${m.w}%`}}/>
              </div>
            </div>
          ))}
        </div>

        {/* PESO CORPORAL */}
        <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:14,padding:16,marginBottom:16}}>
          <div className="sec-title">Peso corporal diário</div>
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            <input type="number" value={todayW} onChange={e=>setTodayW(e.target.value)} placeholder="Ex: 78.5" inputMode="decimal"
              style={{flex:1,background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:8,padding:"10px 12px",color:"var(--text)",fontSize:15,fontFamily:"DM Sans"}}/>
            <span style={{fontSize:13,color:"var(--muted)",display:"flex",alignItems:"center"}}>kg</span>
            <button onClick={saveWeight} style={{padding:"10px 16px",borderRadius:8,border:"none",background:"var(--accent)",color:"#000",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"DM Sans"}}>Salvar</button>
          </div>
          {weightLog.length>=2&&(
            <div className="chart-container">
              <div className="chart-bar-row">
                {weightLog.slice(-8).map((w,i)=>{
                  const all=weightLog.slice(-8).map(x=>x.kg);
                  const mn=Math.min(...all),mx=Math.max(...all);
                  const h=mx===mn?40:((w.kg-mn)/(mx-mn))*55+10;
                  return(
                    <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                      <div style={{fontSize:8,color:"var(--accent)",fontFamily:"Space Mono"}}>{w.kg}</div>
                      <div style={{flex:1,width:"100%",display:"flex",alignItems:"flex-end"}}>
                        <div style={{width:"100%",height:`${h}px`,background:"linear-gradient(180deg,#ff6464,rgba(255,100,100,.2))",borderRadius:"3px 3px 0 0"}}/>
                      </div>
                    </div>
                  );
                })}
              </div>
              <div style={{display:"flex",gap:4}}>
                {weightLog.slice(-8).map((w,i)=><div key={i} style={{flex:1,fontSize:8,color:"var(--muted)",textAlign:"center",fontFamily:"Space Mono"}}>{w.date.slice(0,5)}</div>)}
              </div>
            </div>
          )}
        </div>

        {/* WATER */}
        <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:14,padding:16,marginBottom:16}}>
          <div className="sec-title">Hidratação — {(water*0.25).toFixed(2)}L de {DIET.water}L</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>
            {Array.from({length:total14},(_,i)=>(
              <button key={i} className={`water-cup${i<water?" filled":""}`} onClick={()=>setWater(i<water?i:i+1)}>
                {i<water?"💧":"🫙"}
              </button>
            ))}
          </div>
          <div style={{fontSize:12,color:"var(--muted)"}}>{total14-water} copos restantes</div>
        </div>

        {/* MEALS */}
        <div className="sec-title">Refeições do dia</div>
        {DIET.meals.map(meal=>{
          const isDone=done.includes(meal.id);
          const isOpen=open===meal.id;
          return(
            <div key={meal.id} className="meal-card" style={isDone?{opacity:.7}:{}}>
              <div className="meal-hdr" onClick={()=>setOpen(isOpen?null:meal.id)}>
                <div>
                  <div style={{fontFamily:"Space Mono",fontSize:11,color:"var(--accent)"}}>{meal.time}</div>
                  <div style={{fontSize:15,fontWeight:600,textDecoration:isDone?"line-through":"none"}}>{meal.name}</div>
                </div>
                <div style={{marginLeft:"auto",fontFamily:"Space Mono",fontSize:11,color:"var(--muted)"}}>{meal.kcal} kcal</div>
                <div style={{marginLeft:8,fontSize:18}}>{isDone?"✅":"○"}</div>
              </div>
              {isOpen&&(
                <div className="meal-body su">
                  {meal.foods.map((f,i)=>(
                    <div key={i} className="food-item">
                      <div>
                        <div style={{fontSize:13}}>{f.name}</div>
                        <div style={{display:"flex",gap:8,marginTop:2}}>
                          {[["P",f.p],[" C",f.c],["G",f.f]].map(([l,v])=>(
                            <span key={l} style={{fontSize:10,color:"var(--muted)"}}>{l}:<strong style={{color:"var(--text)"}}>{v}g</strong></span>
                          ))}
                        </div>
                      </div>
                      <div style={{fontSize:12,color:"var(--muted)"}}>{f.amount}</div>
                    </div>
                  ))}
                  <button className={`meal-check-btn${isDone?" done":""}`} style={{marginTop:10,width:"100%",padding:10,borderRadius:10,border:`1px solid ${isDone?"#4dffa0":"var(--border)"}`,background:"transparent",color:isDone?"#4dffa0":"var(--muted)",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"DM Sans",textTransform:"uppercase"}}
                    onClick={()=>setDone(p=>p.includes(meal.id)?p.filter(x=>x!==meal.id):[...p,meal.id])}>
                    {isDone?"✅ Refeição concluída":"Marcar como concluída"}
                  </button>
                </div>
              )}
            </div>
          );
        })}
        <div style={{height:16}}/>
      </div>
    </>
  );
}

// ─── REWARDS TAB ──────────────────────────────────────────────────────────────
function RewardsTab({totalWorkouts,streak}){
  const [stats,setStats]=useLS("body_stats",{weight:"78",waist:"",chest:"",arm:""});
  const [photos,setPhotos]=useLS("progress_photos",[]);
  const [saved,setSaved]=useState(false);

  const xp=totalWorkouts*100+streak*50;

  const today=new Date();

    const d=new Date(today);d.setDate(today.getDate()-34+i);
    const isToday=d.toDateString()===today.toDateString();
    const trained=trainedDates.includes(d.toDateString());
    const sched=PROGRAM.schedule[d.getDay()];
    return{trained,isToday,rest:sched==="rest"};
  });

  const addPhoto=(e)=>{
    const file=e.target.files?.[0];if(!file)return;
    const r=new FileReader();
    r.onload=ev=>setPhotos(p=>[{date:new Date().toLocaleDateString("pt-BR"),url:ev.target.result},...p].slice(0,12));

            </div>

        <div style={{background:"linear-gradient(135deg,#1a1200,#110d00)",border:"1px solid rgba(245,197,24,.3)",borderRadius:14,padding:16,marginBottom:14,display:"flex",alignItems:"center",gap:16}}>
          <div style={{fontSize:40}}>🔥</div>
          <div>
            <div style={{fontFamily:"Bebas Neue",fontSize:48,color:"var(--gold)",lineHeight:1}}>{streak}</div>
            <div style={{fontSize:12,color:"#a08000",textTransform:"uppercase",letterSpacing:1,fontWeight:600}}>dias de streak</div>

          <div style={{marginLeft:"auto",textAlign:"right"}}>
            <div style={{fontSize:10,color:"#a08000",fontFamily:"Space Mono"}}>Total treinos</div>
            <div style={{fontFamily:"Bebas Neue",fontSize:28,color:"var(--gold)"}}>{totalWorkouts}</div>
          </div>
        </div>

        {/* HEATMAP */}
        <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:14,padding:16,marginBottom:14}}>
          <div className="sec-title">Calendário de treinos — últimos 35 dias</div>
          <div style={{display:"flex",gap:4,marginBottom:8,fontSize:9,color:"var(--muted)",fontFamily:"Space Mono"}}>
            {["D","S","T","Q","Q","S","S"].map((d,i)=><div key={i} style={{flex:1,textAlign:"center"}}>{d}</div>)}

          <div className="heatmap">

        <div className="sec-title">Conquistas</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>

              <div key={b.id} className={`badge-card${unlocked?" unlocked":" locked"}`}>

        {/* PROGRESS PHOTOS */}

          </div>

          {photos.map((p,i)=>(
            <div key={i} className="photo-slot filled" style={{padding:0,overflow:"hidden",position:"relative"}}>
              <img src={p.url} alt="progresso" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
              <div style={{position:"absolute",bottom:0,left:0,right:0,background:"rgba(0,0,0,.7)",fontSize:8,color:"#fff",padding:"3px 4px",fontFamily:"Space Mono"}}>{p.date}</div>
            </div>
          ))}
        </div>

        {/* META */}
        <div style={{background:"linear-gradient(135deg,#0a1400,#080808)",border:"1px solid rgba(200,241,53,.2)",borderRadius:14,padding:16,marginBottom:20,textAlign:"center"}}>
          <div style={{fontSize:10,color:"var(--accent)",fontFamily:"Space Mono",letterSpacing:2,textTransform:"uppercase",marginBottom:6}}>Meta Principal</div>

// ─── APP PRINCIPAL ────────────────────────────────────────────────────────────
function App(){
  const [tab,setTab]=useState("home");
  const [activeW,setActiveW]=useState(null);
  const [toast,setToast]=useState({show:false,msg:""});
  const [totalWorkouts,setTotal]=useLS("total_workouts",0);
  const [streak,setStreak]=useLS("streak",0);
  const [lastDate,setLastDate]=useLS("last_date",null);
  const [trainedDates,setTrainedDates]=useLS("trained_dates",[]);

  const t2=msg=>{setToast({show:true,msg});setTimeout(()=>setToast({show:false,msg:""}),3000)};

  const finish=w=>{
    const today=new Date().toDateString();
    const todayStr=new Date().toLocaleDateString("pt-BR");
    setTotal(n=>n+1);
    if(lastDate!==today){
      const yest=new Date();yest.setDate(yest.getDate()-1);
      setStreak(s=>lastDate===yest.toDateString()?s+1:1);
      setLastDate(today);
    }
    if(!trainedDates.includes(today)){
      setTrainedDates(d=>[...d,today]);
    }
    setActiveW(null);
    t2(`🏆 +100 XP — Treino ${w.name} concluído!`);
  };

  const changeTab=t=>{setActiveW(null);setTab(t)};

  const tabs=[
    {id:"home",ico:<Ico.home/>,l:"Início"},
    {id:"diet",ico:<Ico.diet/>,l:"Dieta"},
    {id:"rewards",ico:<Ico.trophy/>,l:"Conquistas"},
    {id:"profile",ico:<Ico.user/>,l:"Perfil"},
  ];

  return(
    <div className="app">
      <Toast msg={toast.msg} show={toast.show}/>

      {activeW&&(
        <WorkoutView workout={activeW} onBack={()=>setActiveW(null)} onFinish={finish} onTabChange={changeTab}/>
      )}

      <div className="scroll">
        {tab==="home"&&<HomeTab onStart={setActiveW} totalWorkouts={totalWorkouts} streak={streak}/>}
        {tab==="diet"&&<DietTab/>}
        {tab==="rewards"&&<RewardsTab totalWorkouts={totalWorkouts} streak={streak}/>}
        {tab==="profile"&&<ProfileTab totalWorkouts={totalWorkouts}/>}
      </div>

      <nav className="nav">
        {tabs.map(t=>(
          <button key={t.id} className={`nb${tab===t.id?" active":""}`} onClick={()=>changeTab(t.id)}>
            {t.ico}{t.l}
          </button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
